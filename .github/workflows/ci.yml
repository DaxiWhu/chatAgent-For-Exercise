name: CI

# ⚠️ 所有 `uses:` 都钉在 **40 位 commit SHA** 上，后面用注释标真实版本号。
# ------------------------------------------------------------------
# 为什么不能用 `@v4` 这种可变 tag：tag 是**可以被上游重指向**的，而 action 的代码
# 会拿到本仓库的 secrets 与 `GITHUB_TOKEN`（`publish` job 还有 `packages: write`
# 与 `id-token: write`）。上游账号被盗或恶意重打 tag 一次，就等于在我们的流水线里
# 执行任意代码、并把发布凭证交出去。commit SHA 不可变，是唯一能钉住的形态。
#
# 怎么升级：不用手抄 SHA。`.github/dependabot.yml` 已接管 `github-actions`，
# 它会**理解 SHA 钉法**并连同后面的 `# vX.Y.Z` 注释一起更新（每周一次 PR）。
# 要手动升某个 action，用它自己的 `uses:` 引用即可，例如：
#   gh api repos/actions/checkout/commits/v5 --jq .sha
#
# 守卫：`tests/test_ci_config.py` 里有两条 —— ①任何 `uses:` 都不允许可变引用；
# ②`aquasecurity/trivy-action` 的引用必须存在（曾经写成 `@0.28.0`，而该仓库
# 只有 `v0.28.0` ⇒ 依赖解析失败，整道镜像漏洞门禁**从未真正跑过**，
# 而 workflow 本身不会因此报"配置错"，只在执行到那一步时失败）。

on:
  push:
    branches: ["**"]
    # ⚠️ 单独一行 `tags` 是**发布链路能否触发**的前提，不是可选装饰。
    # `branches: ["**"]` 只匹配分支；推一个 tag 时它**不匹配**，整个 workflow
    # 连启动都不会 —— 于是 `publish` 里写的 `startsWith(github.ref, 'refs/tags/v')`
    # 永远等不到事件。症状是"发布 job 一直是灰色 skipped"，而且没有任何报错，
    # 看起来像"这次不该发"。2026-11-08 实测：仓库建到现在，`publish` 非 skipped
    # 次数为 0（条件里写的 `refs/heads/main` 也不存在，默认分支是 master），
    # 即这条链路从建立起就没跑过一次。守卫：
    # `tests/test_ci_config.py::test_the_workflow_actually_triggers_on_version_tags`。
    tags: ["v*"]
  pull_request:
  # 每日全量：装齐 docling/transformers，跑一遍主流程刻意跳过的那批用例。
  # UTC 18:00 = 北京时间次日 02:00，避开使用高峰。
  schedule:
    - cron: "0 18 * * *"
  # 手动触发时可选择跑"检索质量门禁"的完整版（需要 embedding 密钥）
  workflow_dispatch:
    inputs:
      full_eval:
        description: "是否跑完整检索评测（需要 EMBEDDING_* 密钥）"
        type: boolean
        default: false

jobs:
  # ------------------------------------------------------------------
  # 0) 静态检查：配置与工具早就在仓库里，但此前**从没被执行过**
  # ------------------------------------------------------------------
  # 2026-10-04 补。`ruff.toml`（规则逐条写了理由）与 `requirements-dev.txt`
  # （ruff/mypy/pytest-cov 都钉了版本）一直都在，唯独**没有任何地方跑它们** ——
  # 一个从未执行的 lint 配置，价值等于零：它既不拦人，也没人知道它是否还对。
  #
  # 为什么现在接就不用"还债"：接入时的实测基线是 **10 处**（6 个一行多语句、
  # 3 个导入顺序、1 个 datetime.UTC 别名），已在本轮清零。所以这个 job 从第一天
  # 起就是绿的，不会给任何人留下"先欠着"的修复量。
  #
  # 为什么是独立 job 而不是并进 test：见 `scripts/tasks.py::task_lint` 的说明
  # （本地 `make check` 与 CI 的 test job 必须逐条对应，那条守卫在
  # tests/test_tasks_entrypoint.py）。放最前面是为了让几秒内能发现的错最先反馈。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      # 只装开发工具（不进生产镜像）。版本是 `==` 钉死的：ruff 的**判定结果**
      # 随版本变（实测 0.16 的默认规则集比旧版宽得多），不钉的话"CI 是绿是红"
      # 会取决于流水线哪天跑的 install，而不是取决于代码。
      - name: 安装静态检查工具
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

  # ------------------------------------------------------------------
  # 1) 单元测试：**完全离线**，不需要任何密钥与网络
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      # 刻意**不装 docling/transformers**：那几个包几个 GB、CI 上装十几分钟，
      # 而测试对它们本来就是 importorskip 的（装了才跑那些用例）。
      # 这里装的是"跑通全部离线用例所必需"的最小集合。
      #
      # ⚠️ **openai-agents / sqlalchemy 必须在这里**（2026-10-03 补）：
      #   agent 链路的测试是 `pytest.importorskip("agents", ...)` 的，缺了这两包
      #   会被**静默跳过**（不是失败）—— 于是 PR 门禁里"跨轮对话历史 + 输入预算"
      #   整块零条断言，而那正是最容易悄悄坏掉的一层（降级都不报错）。
      #   它们都是纯 Python 小包，与 docling 那几个 GB 的解析栈完全不是一回事，
      #   没有任何理由省掉。`sqlalchemy` 是官方 PG 会话后端的依赖
      #   （`openai-agents[sqlalchemy]` extra），用于建异步引擎。
      - name: 安装最小依赖
        run: |
          python -m pip install --upgrade pip
          pip install \
            "langgraph>=0.3" "langgraph-checkpoint-postgres>=2" \
            "langchain-openai>=0.3" "langchain-community>=0.3" \
            "langchain-text-splitters>=0.3" "psycopg[binary]>=3.2" \
            "pydantic>=2.7" python-dotenv \
            "fastapi>=0.110" "uvicorn>=0.30" sse-starlette \
            "scikit-learn>=1.4" "numpy>=1.26" "pgvector>=0.3" \
            pdfminer.six python-docx openpyxl python-pptx beautifulsoup4 lxml \
            "pytest>=8.0" "httpx>=0.27" tiktoken \
            "openai-agents>=0.20" "sqlalchemy[asyncio]>=2.0"

      # 依赖锁定一致性：requirements.txt 声明的包必须都在 requirements.lock 里有精确版本。
      # 放在装依赖之后、跑测试之前 —— 这样"漂移"以最明确的方式失败，
      # 而不是等某个未锁定包在几个月后发新版才暴露。
      #
      # 注意这里只做**静态一致性**校验，不尝试装齐全部依赖：本 job 刻意
      # 不装 docling/transformers（见上方注释），要求"每个包都装了"会必然失败。
      - name: 依赖锁定一致性
        run: python scripts/lock_requirements.py

      - name: 跑全量离线测试
        env:
          # 明确清空外部依赖配置：确保测试走"降级/内存"路径，不偷偷连任何服务
          DB_URL: ""
          LLM_API_KEY: ""
          EMBEDDING_API_KEY: ""
        run: pytest tests/ -q -p no:cacheprovider

  # ------------------------------------------------------------------
  # 1.5) 跨轮对话历史的**真库**测试
  # ------------------------------------------------------------------
  # 为什么单独一个 job，而不是并进上面的 test：
  #   上面的 test 刻意**离线**（显式清空 DB_URL、不连任何服务），而 agent 链路的
  #   单元测试用的是内存假会话 ⇒ "跨轮"这条链路在那里**永远碰不到真库**。
  #   在补上这个 job 之前，能证明"历史真的落库了"的地方**一处都没有** ——
  #   而这一层的失效是**静默的**：取不到历史就降级成"本轮没有历史"，
  #   服务照常返回 200、错误率与延迟全正常。
  #
  # 为什么用真 PG 而不是 mock：这条的全部价值就是"真的写进去、换个连接读回来"。
  #   把库 mock 掉等于什么都没验 —— 与下面 drill job 必须用真 PG 是同一条理由。
  #
  # ⚠️ 依赖清单与 test job 保持一致：`tests/conftest.py` 与各用例会在**收集阶段**
  #   导入 `src/`、`app/` 和官方 agents SDK，少装一个包就整批失败（不是跳过，是红）。
  agent-session-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      pg:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sess
          POSTGRES_PASSWORD: sess
          POSTGRES_DB: sessdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sess"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装最小依赖（与 test job 同清单）
        run: |
          python -m pip install --upgrade pip
          pip install \
            "langgraph>=0.3" "langgraph-checkpoint-postgres>=2" \
            "langchain-openai>=0.3" "langchain-community>=0.3" \
            "langchain-text-splitters>=0.3" "psycopg[binary]>=3.2" \
            "pydantic>=2.7" python-dotenv \
            "fastapi>=0.110" "uvicorn>=0.30" sse-starlette \
            "scikit-learn>=1.4" "numpy>=1.26" "pgvector>=0.3" \
            pdfminer.six python-docx openpyxl python-pptx beautifulsoup4 lxml \
            "pytest>=8.0" "httpx>=0.27" tiktoken \
            "openai-agents>=0.20" "sqlalchemy[asyncio]>=2.0"

      # ⚠️ `sqlalchemy[asyncio]` 的 extra **不能省**（2026-11-06 补）。
      #    `sqlalchemy>=2.0` 本身**不带** `greenlet`，而那正是异步引擎
      #    （`create_async_engine`）与官方 PG 会话后端的运行时必需项。
      #    少了它的报错长这样：
      #
      #        ImportError: The SQLAlchemy asyncio module requires that the
      #        Python 'greenlet' library is installed. In order to ensure this
      #        dependency is available, use the 'sqlalchemy[asyncio]' install
      #        target: 'pip install sqlalchemy[asyncio]'
      #
      #    它是**收集期**错误 ⇒ 整个 `tests/test_agent_session_pg.py` 一条
      #    都跑不起来（6 个 error，不是 6 个 fail），而这个 job 存在的唯一
      #    目的就是那 6 条 —— 等于这个 job 自建立起就没验证过任何东西。
      #
      #    为什么本地发现不了：开发机的 `sqlalchemy` 是被别的包顺带带进来的
      #    （或装过 `[asyncio]`），`greenlet` 早就躺在 site-packages 里了。
      #
      #    ⚠️ 上面 `test` job（约 106 行）与 `bench` job 的同一行也要一起改 ——
      #    它们现在**没崩**只是因为那两条用例在那边被 skip 了，属于运气。
      - name: 跨轮历史的真库测试
        env:
          # 专用变量、**刻意不复用 DB_URL**：把"被测库"与"日常开发库"分开，
          # 免得有人把 DB_URL 指向真实环境时，这个测试跑去建表写数据。
          AGENT_SESSION_TEST_DSN: postgresql://sess:sess@127.0.0.1:5432/sessdb?sslmode=disable
          # 其余外部依赖一律清空：这个 job 只验数据库那条链路。
          DB_URL: ""
          LLM_API_KEY: ""
          EMBEDDING_API_KEY: ""
        run: pytest tests/test_agent_session_pg.py -q -p no:cacheprovider

  # ------------------------------------------------------------------
  # 2) 检索质量门禁：改 prompt / 换模型 / 调切分后，召回率不该悄悄掉
  # ------------------------------------------------------------------
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装最小依赖
        run: |
          python -m pip install --upgrade pip
          pip install "langchain-openai>=0.3" "langchain-text-splitters>=0.3" \
            "scikit-learn>=1.4" "numpy>=1.26" python-dotenv "httpx>=0.27" \
            beautifulsoup4 lxml

      # ⚠️ `beautifulsoup4` / `lxml` **不能省**（2026-11-06 补）—— 门禁的语料里
      #    有一个 `历史.html`，缺 bs4 时 loaders 只是**打印一行 `解析失败，跳过`
      #    然后继续**，于是语料从 35 个片段悄悄缩到 28 个，Top1 从 61% 掉到 50%，
      #    门禁红在"检索质量退化"上 —— 而真正的病因是**依赖没装**。
      #
      #    这条最坏的地方是**两个错误互相掩盖**：红的信息指向检索，日志里那行
      #    `解析失败，跳过 历史.html：No module named 'bs4'` 才是真因，而它藏在
      #    eval 输出的最上面、被后面的表格淹掉。本地永远复现不了（开发机有 bs4）。
      #
      #    也就是说：这道门禁此前的"绿"是**在残缺语料上**得出的。阈值 0.55 是按
      #    61% 的完整语料校准的，一旦依赖掉了就直接跌破 —— 反向说明它确实在防退化，
      #    只是这次防到的是自己缺依赖。

      # 只用 bm25 后端：纯本地、零外部调用、结果确定，适合做 CI 门禁。
      #
      # ⚠️ 口径是由 `scripts/eval_backend.local_eval()` 在**代码里**钉死的，不是靠
      #    "这台机器恰好没配密钥"。本地跑 `make eval` 会 `load_dotenv()` 读到 .env，
      #    那里**没有**下面这道清空 env 的防线 —— 没有代码级的锁，同一份代码在
      #    "有密钥的机器"和 CI 上会给出两套结论且**两边都不报错**（实测：材料层
      #    0.841 红 / 0.955 绿，而阈值只按 bm25 校准过）。清空 env 是第二道防线。
      #
      # 阈值 0.55 是**当前基线（61%）下留出余量**的值；语料/质量提升后应逐步上调，
      # 这样门槛才真正起到"防退化"的作用。
      # 注：换 BM25 后 Top1 基线仍是 61%（Top3 64%→68%、MRR +0.018），故阈值不变。
      #     门禁防的是"检索质量整体退化"，**不负责识别实现被换回 TF-IDF**
      #     （后者排序差异太小，卡不住；那是 tests/test_bm25.py 靠绝对分值钉住的职责）。
      - name: 检索基线门禁（bm25 Top1）
        env:
          DB_URL: ""
          EMBEDDING_API_KEY: ""
          LLM_API_KEY: ""
        run: python scripts/eval_retrieval.py --only bm25 --fail-under 0.55

      # 答案质量门禁：测的是**喂给模型的材料**（引用覆盖 / 关键点覆盖 / 可回溯），
      # 而不是 Top1 召回。两者不能互相替代 —— 检索对不等于答案对：
      # 召回回来的块可能压根不含回答问题需要的事实，那时模型只能漏掉或编。
      #
      # 同样只用 bm25：确定性、零外部调用。模型侧的**忠实度**评测需要
      # LLM-as-judge，那有噪声、要密钥、结果不可复现，不能当 CI 门禁。
      #
      # 它读的是**随仓库分发的 `data/`**（与线上语料同源）—— 语料被改坏、
      # 文件被挪走、切分把内容切碎，都会在这里体现为覆盖率下降。
      - name: 答案质量门禁（引用与关键点覆盖）
        env:
          DB_URL: ""
          EMBEDDING_API_KEY: ""
          LLM_API_KEY: ""
        run: python scripts/eval_answer.py

      # 生成侧质量门禁：测的是**答案本身**（编造标识符 / 该拒答时拒答）。
      # 上面两层都停在模型之前 ——「找对文档」与「材料够用」都推不出「答案忠实」：
      # 模型完全可以拿着含答案的材料，写出一段与材料无关的话。
      #
      # 离线模式对**人工参考答案**跑指标，纯本地、零密钥、结果确定，所以能进 CI；
      # 模型质量（`--live`）要密钥且随模型漂移，不进（随机红的下场是被关掉）。
      # 它守的是「指标本身没坏」+「忠实答案不被误报成编造」。
      - name: 生成侧质量门禁（编造与拒答）
        env:
          DB_URL: ""
          EMBEDDING_API_KEY: ""
          LLM_API_KEY: ""
        run: python scripts/eval_generation.py

  # ------------------------------------------------------------------
  # 2.5) 真模型质量：工具三层（每晚跑，与基线对比）
  # ------------------------------------------------------------------
  # 上面 eval-gate 的三个门禁全都**不碰模型**（bm25 检索 / 人工参考答案 /
  # 规则判定）。所以"模型到底会不会用这些工具"在 CI 里一直是空的 ——
  # 而这层坏掉的表现是**看着全对**：模型心算出数、答案完全合理，只是没调工具。
  #
  # 为什么只在 schedule / workflow_dispatch 跑
  # ----------------------------------------
  # 它要密钥、随模型漂移、一次约 1 分钟几分钱。放进 PR 路径的代价是"随机红"，
  # 而随机红的终点是有人把它 `continue-on-error` 掉 —— 那比不设更糟（给了错觉）。
  # 定时跑的意义是"有人每天看一眼"，红了不拦任何合并。
  #
  # ⚠️ 退出码语义与手动跑不同（脚本里 `_exit_code` 写明）：带 `--baseline` 时
  #    只判"比基线差才红"，不判"是否全过"。基线里带着一条已知失败（跨轮记忆
  #    第一轮调了 `remember`，那一轮刻意要求只靠会话历史），按"全过才 0"会让
  #    这条件从第一天起每晚都红，然后被所有人忽略。
  #
  # ⚠️ 基线**不会被自动覆写**：那等于自愈门禁。确认新数字可作为基线时，
  #    手动跑一次并把 `--json` 指到 `scripts/agent_tool_eval_baseline.json`。
  agent-quality:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装最小依赖
        run: |
          python -m pip install --upgrade pip
          pip install \
            "langgraph>=0.3" "langchain-openai>=0.3" "langchain-community>=0.3" \
            "langchain-text-splitters>=0.3" "pydantic>=2.7" python-dotenv \
            "openai-agents>=0.20" "httpx>=0.27" tiktoken "numpy>=1.26" \
            "scikit-learn>=1.4"

      - name: 跑工具三层评测（与基线对比）
        env:
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_MODEL: deepseek-chat
          # ⚠️ 这一行不能省：`build_model` 在 base_url 为空时**不传该参数**，
          #    于是客户端打 api.openai.com，而 DeepSeek 的 key 在那里是 401。
          #    症状是"任务失败但看不出为什么"—— 它不会说"地址配错了"。
          LLM_API_BASE: https://api.deepseek.com
          # DeepSeek 不支持 response_format=json_schema：三个 as_tool 专家会全部
          # 400，而选择层的通过率看起来照样可能满分（模型自己瞎猜也能猜对一部分）。
          AGENT_STRUCTURED_OUTPUT: json_object
          # 明确清空检索后端：评测自带桩语料，不连任何外部 embedding 服务。
          EMBEDDING_API_KEY: ""
          DB_URL: ""
        run: |
          if [ -z "${LLM_API_KEY}" ]; then
            echo "::error::仓库没有 DEEPSEEK_API_KEY secret —— 真模型评测跑不了。"
            echo "这不是'跳过'：没有它，工具三层这一整层在 CI 里就是空的。"
            echo "补法见 SERVICE_CONSTRAINTS.md 里 e2e 那一段（同一个 secret）。"
            exit 1
          fi
          python scripts/agent_tool_eval.py \
            --baseline scripts/agent_tool_eval_baseline.json \
            --json agent-tool-eval.json

      - name: 上传明细（无论成败）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: agent-tool-eval
          path: agent-tool-eval.json
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # 2.5) 热路径性能门禁：只断言**机器无关的不变量**
  # ------------------------------------------------------------------
  # 为什么必须有这个 job
  # -------------------
  # 上面几个 job 守的是"功能对不对"，而下面这三件事**功能全对、错误率为 0、
  # 延迟也还看不出来**，只有把样本量加大才显形：
  #
  #   a) 限流器退回"每次请求扫全表" ⇒ 高基数 IP 下吞吐随客户端数下降。
  #   b) 配额结算每次重新遍历活跃租户 ⇒ 同上。
  #   c) 指标直方图退回"存原始观测值" ⇒ 内存随 QPS **线性增长**，一个被刷的
  #      接口即可 OOM，而 `_count` 的增长看起来完全正常。
  #
  # 为什么是独立 job 而不是并进 test
  # ------------------------------
  # 与 lint 同理：本地 `make check` 必须与 CI 的 test job **逐条对应**
  # （守卫在 tests/test_tasks_entrypoint.py）。性能门禁需要"把样本翻 4 倍再比"
  # 这种只有它才做的动作，塞进 test job 会让本地 `check` 变成几分钟的全量遍历。
  #
  # ⚠️ 只断言不变量，不比对绝对耗时
  # ----------------------------
  # CI runner 与开发机的绝对微秒数差 2~3 倍很常见，拿本机基线判 CI 会天天红 ——
  # 而"随机红"的终点是有人把门禁 `continue-on-error` 掉或直接删掉，那比不设门禁
  # 更糟（它给了"有防护"的错觉）。所以这里只用两类跨机器成立的判据：
  #   1. 规模不变量：翻 4 倍样本，单次耗时 ≤ 2 倍（每个规模量 3 次取最小，吸收
  #      runner 上的 GC/抢占噪声 —— 噪声是单向的，只有 min 不被它污染）；
  #   2. 内存有界：直方图格数恒为 `len(bucket_bounds()) + 1`。
  # 绝对耗时对比是**显式动作**（`--baseline`，本地/发版前人工跑），不在这里。

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      # 依赖清单与 test job 保持一致：`bench_local` 会 import `app.ratelimit` /
      # `app.quota` / `app.metrics`（都是标准库）以及 `src.rag.retrieval`
      # （要 langchain-openai + langchain-text-splitters；`qdrant_client` 是**惰性**
      # 导入的，不需要）。与 agent-session-pg 一样照抄 test job 的清单，
      # 而不是另立一份 —— 少装一个包的报错是收集期的 ImportError，
      # 看起来像"基准坏了"而不是"依赖没装"。
      - name: 安装最小依赖（与 test job 同清单）
        run: |
          python -m pip install --upgrade pip
          pip install \
            "langgraph>=0.3" "langgraph-checkpoint-postgres>=2" \
            "langchain-openai>=0.3" "langchain-community>=0.3" \
            "langchain-text-splitters>=0.3" "psycopg[binary]>=3.2" \
            "pydantic>=2.7" python-dotenv \
            "fastapi>=0.110" "uvicorn>=0.30" sse-starlette \
            "scikit-learn>=1.4" "numpy>=1.26" "pgvector>=0.3" \
            pdfminer.six python-docx openpyxl python-pptx beautifulsoup4 lxml \
            "pytest>=8.0" "httpx>=0.27" tiktoken \
            "openai-agents>=0.20" "sqlalchemy[asyncio]>=2.0"

      # 清空外部依赖配置（与 test / eval-gate 同口径）：这里量的是**本机**开销，
      # 一旦有 EMBEDDING_API_KEY，检索基准量的就是外部网络往返而不是热路径。
      # 注：`bench_retrieval` 内部还有一道 `local_eval()` 的**代码级**锁
      # （见 scripts/eval_backend.py），env 清空只是第二道防线。
      - name: 热路径不变量门禁（规模 + 内存）
        env:
          DB_URL: ""
          LLM_API_KEY: ""
          EMBEDDING_API_KEY: ""
        run: python scripts/bench_local.py --check --n 10000

  # ------------------------------------------------------------------
  # 3) 全量依赖（每日定时 / 手动）：补上主流程刻意跳过的那批用例
  # ------------------------------------------------------------------
  # 为什么必须有这个 job
  # -------------------
  # 上面的 `test` job 刻意**不装** docling / transformers（那几个包几个 GB、
  # CI 上要装十几分钟），而那批测试是 `pytest.importorskip` 的 —— 结果是
  # **最复杂、最容易坏的解析链路（表格 / 版式 / OCR）在 CI 里一行都没跑**。
  # "本地绿"因此不等于"CI 绿"。这里用一个慢 job 把这块补上：每天一次、
  # 允许它慢（90 分钟超时），它红了就说明解析链路真的坏了。
  #
  # 本地已实测：装上 docling 2.129 + transformers 后，全量 508 个用例可全绿。
  # 如果嫌装 torch 太慢，可在下面先装 CPU 版：
  #   pip install torch --index-url https://download.pytorch.org/whl/cpu
  full-deps:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装全量依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ⚠️ 必须先**真的把模型下下来**，否则下面那条"全量测试"必然红（2026-11-06 首次真跑）
      # ---------------------------------------------------------------------------
      # `tests/conftest.py` 默认 `HF_HUB_OFFLINE=1`，它写着"这几个模型本来就在本地缓存里"，
      # 前提是开发机跑过 `scripts/fetch_docling_models.py`（`models/` 有 430MB，**没入库**）。
      # CI 的 runner 是干净环境，从来没缓存过 ⇒ docling 直接报：
      #     Cannot find an appropriate cached snapshot folder ... HF_HUB_OFFLINE=0
      # 于是 test_cite_images 里 5 条表格/扫描件用例全红，而它们红的真因是
      # **"没下模型"**，不是"解析逻辑坏了"。
      #
      # 为什么是"在这里预取"而不是"把 HF_HUB_OFFLINE 关掉"：
      # 关掉之后测试就**依赖网络**了 —— 网络一抖就是随机红，而且这类红会让人
      # 学会"重跑一次就好"，门禁慢慢失效。所以口径是：**取模型时联网、测试时离线**。
      # 这样"模型在不在"与"代码对不对"两件事各自独立、各自可解释。
      #
      # 用 `scripts/fetch_docling_models.py` 而不是 `docling --download-models`：
      # 那个脚本正是为绕开 HF 缓存的符号链接与 .lock 删除问题写的（见其模块说明），
      # 在受限的 CI runner 上更可靠；且它按 `docling` 自身读清单，不会随版本漂移。
      - name: 预取 docling 模型（测试步骤随后仍走离线）
        env:
          HF_ENDPOINT: https://hf-mirror.com
        run: |
          set -eu
          python scripts/fetch_docling_models.py models/docling --endpoint "$HF_ENDPOINT"
          echo "已下载到 models/docling："
          du -sh models/docling
          # 自检：目录非空才算成功。脚本本身在失败时返回 1，这里再确认一次
          # —— 免得"退出码被管道吃掉"这类问题让它静默通过。
          test -d models/docling && [ -n "$(ls -A models/docling)" ] || {
            echo "::error::models/docling 是空的 —— 测试会因缺少模型而全红"
            exit 1
          }

      - name: 全量测试（含 docling 解析链路）
        env:
          # 与 test job 同口径：清空外部依赖配置，确保走降级/离线路径
          DB_URL: ""
          LLM_API_KEY: ""
          EMBEDDING_API_KEY: ""
          HF_ENDPOINT: https://hf-mirror.com
          # 让 docling 直接从上面下好的目录加载，不经 HF 缓存（symbolic link / lock
          # 那类问题在 CI 上同样存在，绕开它最稳）。
          DOCLING_ARTIFACTS_PATH: models/docling
          # 显式钉住离线：本步**不该**联网。若哪个用例偷偷去拉模型，
          # 宁可立刻失败，也不要卡在 TLS 握手上等几分钟。
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: pytest tests/ -q -p no:cacheprovider

  # ------------------------------------------------------------------
  # 3.5) 恢复演练（每月一次）：证明"备份能被恢复"这条链没有腐烂
  # ------------------------------------------------------------------
  # 为什么必须有这个 job
  # -------------------
  # `scripts/pg_backup.py drill` 是唯一能证明"备份可用"的操作（备份 → 恢复到临时库
  # → 逐表比对行数），但**此前没有任何东西在跑它**：RUNBOOK 写着"每季度做一次"，
  # 而靠人记着的事一定会在最忙的那一季度被跳过。
  #
  # 生产上的演练要建临时库、要连真实数据，只能人工做（缺失由
  # `BackupDrillMissing` / `BackupDrillOverdue` 两条告警来吵你）。这里补的是另一半：
  # **脚本本身没坏**。恢复路径、临时库的建与删、行数比对 —— 这些一旦被改坏，
  # 只有在真的需要恢复的那天才会暴露，而那时已经晚了。
  #
  # 用 service container 起**真 PG**：drill 的全部价值就在于"真的恢复一次"，
  # 把数据库 mock 掉等于什么都没验证。
  drill:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      pg:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: drill
          POSTGRES_PASSWORD: drill
          POSTGRES_DB: drilldb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U drill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: 装 PG 客户端与 psycopg
        run: |
          python -m pip install --upgrade pip
          pip install "psycopg[binary]>=3.2" python-dotenv
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: 建表并插数据（drill 需要"有东西可比对"）
        env:
          PGPASSWORD: drill
        run: |
          set -eu
          psql -h 127.0.0.1 -U drill -d drilldb -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS checkpoints (
            id serial PRIMARY KEY,
            payload text NOT NULL
          );
          INSERT INTO checkpoints (payload)
          SELECT 'x' || g FROM generate_series(1, 200) AS g;
          SQL
          psql -h 127.0.0.1 -U drill -d drilldb -c '\dt'

      # 真跑一遍「备份 → 恢复到临时库 → 逐表比对 → 清理」。脚本自己会在结尾删临时库。
      # 给一个独立的 BACKUP_DIR，避免污染工作区。
      - name: 恢复演练
        env:
          DB_URL: postgresql://drill:drill@127.0.0.1:5432/drilldb?sslmode=disable
          BACKUP_DIR: /tmp/drill-backups
        run: python scripts/pg_backup.py drill

      # 演练"通过"还不够：结果必须**落在指标上**，否则生产上的
      # BackupDrillMissing / BackupDrillOverdue 就是哑弹。
      # 这里断言的是**线格式**（文件里真有那一行），而不是"函数被调用过"。
      #
      # ⚠️ 路径必须是 `backups/drill-pg.prom`，**不要**设 `DRILL_METRICS_DIR`
      # 把它挪到 `/tmp/...` 去迁就这条断言（2026-11-06 修，首次真跑就红在这）。
      #
      # 原因：指标目录与备份目录是**两个概念**（见 `scripts/drill_metrics.py`
      # 的 `metrics_dir()` 说明）——
      #   · `BACKUP_DIR` 是"dump 落在哪"，本 job 用 `/tmp/drill-backups` 避免污染工作区；
      #   · `DRILL_METRICS_DIR` 是"node-exporter 采集哪个目录"，默认 `backups`
      #     （与 compose 里 node-exporter 的 textfile 挂载一致）。
      # 这一层要验的正是"生产上那条路径能不能收到指标"。若在 CI 里把它改指 `/tmp`，
      # 验的就是一条**生产上根本不存在**的路径 —— 测试会绿，而真出事时那三条告警
      # 依然是哑弹。所以这里刻意跟着默认值走。
      #
      # 守卫：`tests/test_drill_closure.py::test_ci_checks_the_path_metrics_are_actually_published_to`
      # 会把这条路径与发布器的默认落地路径逐字比对，防止下次改了默认目录又静默脱节。
      - name: 校验演练指标真的写出来了
        run: |
          set -eu
          F=backups/drill-pg.prom
          test -f "$F" || { echo "::error::没有生成 $F —— 演练指标没发布，那两条告警会是哑弹"; exit 1; }
          cat "$F"
          grep -q 'backup_drill_result{target="pg"} 1' "$F" \
            || { echo "::error::backup_drill_result 不是 1"; exit 1; }
          grep -q 'backup_drill_last_success_timestamp_seconds{target="pg"}' "$F" \
            || { echo "::error::缺 backup_drill_last_success_timestamp_seconds"; exit 1; }

  # ------------------------------------------------------------------
  # 3.6) 端到端：真起一套栈，验证**进程内测不到**的三件事
  # ------------------------------------------------------------------
  # 为什么值得花几分钟起整套容器
  # -------------------------
  # `tests/` 里其余用例都是**进程内**的（TestClient / 直接调函数），下面三件事
  # 它们原理上就覆盖不到，而这三件恰好都是"告警不响、只是体验悄悄变差"的类型：
  #
  #   a) nginx 漏写 `proxy_buffering off` ⇒ 流式回答变成"卡十几秒再一次性吐出来"。
  #      进程内测试压根不经过 nginx，永远看不出来。
  #   b) 灰度权重没生效（写错位置 / upstream 里没有 canary）⇒ 发新版时那句
  #      "10% 流量"其实全打在旧版本上，整个发布验证等于白做。
  #   c) 检查点退回内存（DB_URL 没传进容器 / 异步连接落到不支持的事件循环上）
  #      ⇒ 服务照常工作、回答照常出，**只在容器重启后丢状态**。
  #
  # 触发刻意收窄到「手动 + 每晚定时」：起全套容器要几分钟，而它防住的不是
  # "这次改动错了"（那是 test job 的活），而是"部署面悄悄漂了"—— 按天发现足够。
  e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      # 只需要能跑 `scripts/tasks.py`（纯标准库）+ pytest。另外为了让
      # `scripts/hash_password` 能 import `app.auth`，实测其依赖链
      # （app/auth → app/config、app/metrics）**全是标准库**（哈希是 `hashlib.pbkdf2_hmac`），
      # 唯一的外部依赖是 `python-dotenv`（用于读 `.env`；缺失时会静默退化，但装上更贴近真实部署）。
      #
      # ⚠️ 这份清单是**契约**，不是"差不多够用"（2026-11-07 第四次真跑）
      # ------------------------------------------------------------------
      # 那天 6 条 e2e 用例**全部 ERROR**（不是断言失败，是 setup 阶段）：
      #     ModuleNotFoundError: No module named 'langchain_openai'
      # 看起来像"少了依赖，补上就行"，真因却在 `tests/conftest.py`：一条 autouse
      # fixture 在 import 期把 `src.rag.retrieval` 拖了进来，而它模块级就
      # `from langchain_openai import ChatOpenAI`。也就是说，一个**只发 HTTP 请求**
      # 的黑盒进程被塞进了整棵服务端依赖树。
      #
      # 修法是让那条 fixture 在缺依赖时什么都不做，**不是**往这里加 langchain-openai：
      # 黑盒进程里根本不存在 retrieval 的进程级状态需要重置，那种"补依赖"式的修法
      # 会让这份清单一路腐化（今天 langchain-openai、明天 docling、后天 torch）。
      # 守卫：tests/test_ci_config.py 里的
      #   `test_e2e_job_stays_a_black_box_client`（清单里不许有服务端依赖）
      #   `test_conftest_loads_without_server_side_dependencies`（真跑一遍黑盒加载）
      - name: 安装最小依赖
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=8.0" python-dotenv

      # 栈从 .env 读配置。**这里刻意让栈"要求用户鉴权"**：
      #
      #   · LLM_API_KEY 是**非空占位符** ⇒ /health/ready 的 llm 检查通过
      #     （它只查"配置在不在"，不发请求）。真去调 LLM 会失败并回 `error` 事件，
      #     而 SSE 用例接受的正是"合法帧"—— 见 tests/test_e2e_stack.py 的说明。
      #   · 配 AUTH_*（会话签名密钥 + 一个服务账号）⇒ 栈要求鉴权，于是：
      #       - 用例会用 E2E_USER/E2E_PASSWORD 登录换 Bearer（真正跑一遍 JWT 路径）；
      #       - 裸请求必须得 **401**（test_protected_endpoint_rejects_unauthenticated_requests）。
      #
      #     ⚠️ 2026-10-05：这里**不再**写 `REQUIRE_AUTH=1`。该开关已随"匿名兜底"
      #     一起**删除** —— 鉴权要求现在是结构性的（没配 AUTH_* 的服务在启动期就被拦），
      #     没有任何变量能关掉它。而且残留这个键会让服务**拒绝启动**（守卫：
      #     `app/main.py::_assert_no_legacy_auth_knobs`），留着的唯一后果是 e2e 起不来。
      #     （更早的 2026-10-04 之前，这个效果还是靠 `.env.example` 里 `SERVE_API_KEY`
      #     的非空占位符达成的；那把共享密钥废弃、模板改成空值之后本 job 一度静默
      #     退化成"无鉴权栈"—— CI 照常绿，但生产口径的鉴权再也没人守。）
      #   · 刻意**不设** `APP_ENV=production`：目标只是"要求鉴权"，不是把 e2e 变成
      #     生产全量口径测试（那会连带关掉 /docs、隐藏错误详情，干扰其它断言）。
      #     生产启动期检查由 `tests/test_identity.py` 的守卫覆盖。
      - name: 准备 .env（含一个 e2e 服务账号）
        env:
          # 真模型 Key。只在**这一步的 shell** 里存在：没开 `set -x`，
          # 日志里不会出现值；也不写进任何持久化位置（.env 除外）。
          E2E_LLM_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          cp .env.example .env
          # 会话签名密钥：每次现生成，不进仓库
          printf 'AUTH_SESSION_SECRET=%s\n' "$(openssl rand -hex 32)" >> .env

          # ⚠️ 三个口令必须**现生成**填进去（2026-11-06 修，e2e 首次真跑就红在这）
          #
          # `.env.example` 里这三个键是**故意留空**的（`tests/test_deploy_topology.py::
          # test_env_example_does_not_ship_weak_passwords` 钉着这一点），而 compose 里
          # 它们是 `${VAR:?…}` 的必填写法 ⇒ 空值 = `docker compose` 直接报错退出：
          #   "required variable POSTGRES_PASSWORD is missing a value"
          # 也就是说"复制模板"这一步本身就不足以让栈起来，缺的正是口令。
          #
          # 为什么是"在这里生成"而不是"给模板填个默认值"：
          # 给模板填默认值等于把口令公开写在仓库里，而且 compose 那边的必填写法
          # 就是为了挡这件事 —— 加默认值会把那条守卫的价值整个抵消。
          #
          # 为什么 e2e 也要**真口令**而不是随便一个占位：
          # Redis 带 `--requirepass`、PG 带 `POSTGRES_PASSWORD`，服务端与客户端
          # （app 的 `DB_URL`/`REDIS_URL`）插值的是同一个变量，所以只要"非空且一致"
          # 就能起来。用随机值只是顺手保证了"CI 日志里不会出现一个能复用的口令"。
          #
          # GRAFANA_PASSWORD 也一起填：它属于 observability profile（本 job 不启用），
          # 但 compose 的变量插值是**整文件**做的 —— 只要文件里有 `${VAR:?}`，
          # 就算那个服务不会启动，缺值同样会让**任何** compose 命令直接失败
          # （实测：`docker compose ... ps` 也一起报错，把排查方向带到"哪个容器没起来"上）。
          #
          # 用 `sed` 原地替换而不是"删掉再追加"：追加会把口令挪到文件末尾，
          # 与它们上方那几段说明（"只在数据卷首次初始化时生效"等）分家 ——
          # 排障时看到的是一个孤零零的键，得回头翻 600 行才知道它是什么。
          # `s|^KEY=.*|KEY=VALUE|` 同时保证"原来那行空值被换掉，不会出现两个同名键"。
          set_pw() {
            sed -i "s|^$1=.*|$1=$2|" .env
          }
          set_pw POSTGRES_PASSWORD "pg-$(openssl rand -hex 16)"
          set_pw REDIS_PASSWORD "redis-$(openssl rand -hex 16)"
          set_pw GRAFANA_PASSWORD "grafana-$(openssl rand -hex 16)"

          # 真模型（2026-11-08）
          # ------------------------------------------------------------
          # `tests/test_e2e_stack.py` 现在有一条用例要校验 `token` + `done`，
          # 它证明的**不是**"nginx 不攒帧"，而是"agent 链路真的跑通"。
          # 此前只有前者：2026-11-07 的 e2e 全绿，日志里却有 4 次 `UndefinedTable`
          # 与 `agent 链路执行异常` —— 因为 `error` 也是合法 SSE 帧。
          #
          # 没有 Key 时那条会 **skip**（`tasks.py` 读 .env 后自动设 `E2E_EXPECT_LLM=0`），
          # 不会伪装成通过，但也就等于本 job 没有覆盖 agent 主链路。
          # 要覆盖：仓库 Settings → Secrets and variables → Actions 加
          # `DEEPSEEK_API_KEY`（与本地 `.env` 的 `LLM_API_KEY` 同一个值）。
          if [ -n "${E2E_LLM_KEY:-}" ]; then
            sed -i "s|^LLM_API_KEY=.*|LLM_API_KEY=${E2E_LLM_KEY}|" .env
            echo "[e2e] ✓ 已注入真模型 Key ⇒ 会校验 token + done"
          else
            echo "⚠️ 没有 DEEPSEEK_API_KEY secret ⇒ 本 job 只验分帧，"
            echo "   『链路跑通』那条用例会被 skip。这不是通过，是没覆盖。"
          fi

          # 服务账号：**不给角色**（最小权限，与 scripts/script_auth.py 的指引一致）。
          # 密码每次随机、写进 GITHUB_ENV 供后续 pytest 步骤读，不落仓库。
          PW="e2e-$(openssl rand -hex 12)"
          printf 'E2E_USER=svc-e2e\nE2E_PASSWORD=%s\n' "$PW" >> "$GITHUB_ENV"
          # `hash_password` 输出两行（提示行 + `AUTH_USERS='...'`），取最后一行。
          # 必须保留单引号：PBKDF2 串里的 `$` 会被 docker compose 插值吃掉。
          ENTRY=$(printf '%s\n' "$PW" \
            | python -m scripts.hash_password -u svc-e2e -t e2e --stdin | tail -n 1)
          printf '%s\n' "$ENTRY" >> .env
          # 自检：两样都写进去了（只打键名，不打值 —— CI 日志是公开的）
          for k in AUTH_SESSION_SECRET AUTH_USERS; do
            grep -q "^${k}=" .env || { echo "✗ .env 缺少 ${k}"; exit 1; }
          done
          # 自检：compose 里所有 `${VAR:?}` 的必填变量都**非空**。
          # 这一步刻意放在起栈之前：同类问题在起栈阶段的表现是
          # "error while interpolating ..."，而 tasks.py 会把失败归到
          # "起栈并跑端到端检查"，真因藏在一行 compose 报错里。
          missing=""
          for k in POSTGRES_PASSWORD REDIS_PASSWORD GRAFANA_PASSWORD; do
            v=$(sed -n "s/^${k}=//p" .env | tail -n 1)
            [ -n "$v" ] || missing="${missing} ${k}"
          done
          if [ -n "$missing" ]; then
            echo "✗ .env 里这些必填口令是空的（compose 会直接报错退出）：${missing}"
            exit 1
          fi
          # 反向自检：已删除的开关**不许**出现 —— 存在即拒绝启动，那会让 e2e 卡在
          # "容器起不来"上，报错信息藏在容器日志里，排查成本远高于在这里拦一下。
          for k in SERVE_API_KEY REQUIRE_AUTH; do
            if grep -q "^${k}=" .env; then
              echo "✗ .env 含有已删除的鉴权开关 ${k}（存在即拒绝启动）"
              exit 1
            fi
          done
          echo "[e2e] .env 就绪：要求鉴权 + 服务账号 svc-e2e + 三个随机口令（都不落仓库）"

      # 一条命令包办：构建 → 起数据层 → 建表 → 起栈 → 等就绪 → 跑检查 → 失败时打印容器日志 → 收栈
      #
      # 「建表」这一步不能省（2026-11-07 第七次真跑才发现漏了）：
      # `agent_runs` / `agent_messages` / `agent_memories` / `agent_history_compactions`
      # 四张表没有任何模块会在首次写入时自建，DDL 的单一出处是 `app/migrations.py`。
      # 不跑迁移 ⇒ 每个 chat 请求都 `psycopg.errors.UndefinedTable`，而 SSE 用例
      # 按设计接受 `error` 事件 ⇒ **整条链路一次都没跑通，用例却是绿的**。
      - name: 起栈并跑端到端检查
        run: python scripts/tasks.py e2e --build

      # tasks.py 已在失败时打过 app-stable 与 nginx 的尾部日志；这里补全量，
      # 好让"哪个容器没起来"一眼可见。
      - name: 失败时导出全部容器日志
        if: failure()
        run: |
          docker compose --env-file .env -f deploy/app/docker-compose.yml ps || true
          docker compose --env-file .env -f deploy/app/docker-compose.yml logs --tail=300 || true

  # ------------------------------------------------------------------
  # 4) 部署产物：镜像构建 → 冒烟启动 → 漏洞扫描
  # ------------------------------------------------------------------
  # 为什么必须有这个 job
  # -------------------
  # 上面三个 job 只验证 **Python 代码**。真正上线的东西是**镜像**，而它此前
  # 一行都没被验证过。三类问题只有"真构建 + 真启动"才暴露：
  #
  #   a) `requirements.lock` 钉了一个不存在的版本 ⇒ pip 解析失败。
  #      纯静态检查（`scripts/lock_requirements.py`）看不出这点，只有真装才知道。
  #   b) `COPY` 少拷一个目录 / 路径写错 ⇒ 镜像**构建成功**，启动时才 ImportError。
  #   c) 缺 `libgl1` 之类的系统库、`CMD` 写错、端口没 EXPOSE ⇒ 构建成功，容器起不来。
  #
  # 所以本 job 的三步是**递进**的：构建 ⇒ 起来探活 ⇒ 扫漏洞。缺任何一步都有盲区 ——
  # 尤其是"只构建不启动"：它给人一种"产物已验证"的错觉，实际连都连不上。
  image:
    runs-on: ubuntu-latest
    # 构建本身含几个 GB 的 pip 安装。没超时的话，一次卡死会白烧 6 小时 runner。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # 没缓存的话每次 push 都重装十几分钟，这个 job 很快会被绕过或删掉。
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - name: 构建镜像
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: deploy/app/Dockerfile
          push: false
          # 必须 load 到本地 docker，下一步 `docker run` 才找得到这个镜像
          load: true
          tags: chatagent:ci
          # ⚠️ CI 只构建 **slim** 变体（INSTALL_DOCLING=0）：装齐
          # docling/transformers/torch 会让构建时长与磁盘占用翻几倍，
          # 而"重依赖能不能装、解析链路能不能跑"已由上面的 full-deps job 在
          # Python 层覆盖。本 job 关心的是**打包与启动**（COPY / CMD / 系统库 /
          # 依赖锁定），这与装不装 docling 无关。
          build-args: |
            INSTALL_DOCLING=0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 启动容器并探活
        # 这一步不可省：`docker build` 成功只证明"层能构建"，不证明**应用能起来**。
        #
        # ⚠️ 必须传 `LLM_API_KEY`（2026-11-07 第三次真跑撞出来的）
        # ------------------------------------------------------------------
        # 这里原来刻意**不传任何环境变量**，理由写的是"默认配置就能启动本身就是
        # 被断言的东西（镜像不该依赖某个没写进 Dockerfile 的环境变量才能跑）"。
        # 这个理由与服务自身的**刻意设计**直接冲突 ——
        # `app.main._assert_agents_ready()` 在 Key 为空时主动 raise 让进程退出
        # （`missing_api_key ⇒ 拒绝启动`）。也就是说"没 Key 也能起来"从来不是契约，
        # 恰恰相反："起不来"才是契约。
        # ⇒ 这一步从写下那天起就**必然红**：实测 60 秒探活超时，容器日志是
        #      RuntimeError: agent 链路不可用（missing_api_key）⇒ 拒绝启动。
        #    （镜像构建、pip 安装、导入链全部成功，唯独在"应用启动"这一环断掉。）
        #
        # 现在拆成两条**互补**的断言，取代原来那条错的口径：
        #   ① 正向：给了**最小必需配置**后能起来并通过 `/health/live`
        #      —— 检的是「依赖完整 + 打包没错 + 端口/CMD 对」；
        #   ② 反向：**不给 Key 时必须拒绝启动**（fail-closed 契约）
        #      —— 否则 `_assert_agents_ready` 被谁改软了也没人知道。
        # 拆开之后，"配置缺失"不会再被误读成"镜像坏了"，
        # 而 fail-closed 这条真正重要、又最容易被人"顺手放宽"的契约被单独钉住。
        run: |
          set -eu

          # ① 反向断言先跑（便宜：进程导入期就退出，不占端口）
          #    期望：非 0 退出，且**必须是自己退出** ——
          #      rc=0    ⇒ 没 Key 也起来了，fail-closed 被破坏；
          #      rc=124  ⇒ 60 秒还活着（挂住），同样不算拒绝启动。
          set +e
          timeout 60 docker run --rm --name chatagent-ci-nokey chatagent:ci \
            >/tmp/nokey.log 2>&1
          rc=$?
          set -e
          if [ "$rc" = "0" ] || [ "$rc" = "124" ]; then
            echo "::error::没有 LLM_API_KEY 时容器没有拒绝启动（rc=$rc）—— fail-closed 契约被破坏"
            sed -n '1,80p' /tmp/nokey.log
            exit 1
          fi
          echo "反向断言通过：无 Key 拒绝启动（rc=$rc）"
          if ! grep -q "missing_api_key" /tmp/nokey.log; then
            echo "::error::无 Key 时容器确实退出了，但**不是因为缺 Key** —— 真因见下"
            sed -n '1,80p' /tmp/nokey.log
            exit 1
          fi

          # ② 正向：给最小必需配置（只需 Key；其余走默认值），能起来并回 200
          docker run -d --name chatagent-ci -p 8000:8000 \
            -e LLM_API_KEY=ci-smoke-dummy-not-a-real-key \
            chatagent:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/live >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::容器未能在 60 秒内通过 /health/live（看下面的容器日志定位原因）"
            docker logs chatagent-ci || true
            exit 1
          fi
          echo "探活通过：$(curl -fsS http://localhost:8000/health/live)"
          docker logs chatagent-ci || true

      # 扫描结论的**前提**：镜像里到底装了什么（2026-11-07 第四次真跑）
      # ------------------------------------------------------------------
      # 那次扫描报了 msgpack 1.1.2 / setuptools 70.3.0 / urllib3 2.7.0，而同一份
      # 报告的 python-pkg 明细里明明写着 msgpack-1.2.3 / setuptools-81.0.0 /
      # urllib3-2.8.0，三者的漏洞数都是 0；构建日志也是"Successfully installed 1.2.3"。
      # 也就是说：**同一个镜像里出现两套版本**，而报告只给了"目标: Python"这种
      # 不带路径的写法，看不出第二套在哪。
      #
      # 与其猜（"缓存层？SBOM？第二份 site-packages？"），不如把这件事本身变成一个
      # 可读的输出：发行版元数据的真实路径 + 有没有 SBOM 文件。这三行在正常运行时
      # 只花两秒，但它决定了扫描红的时候"该改代码"还是"该改扫描口径"。
      - name: 镜像内容自检（扫描结论的前提）
        run: |
          set -eu
          echo "── 这几个包在镜像里到底是哪个版本、来自哪个 dist-info ──"
          # ⚠️ `-i` 不能省：不加它 docker 会把容器的 stdin 直接关掉，
          #    `python -` 读到的就是空脚本 —— **静默退出 0、一行都不打印**
          #    （第一次写这一步时就是这样，看着"跑过了"，其实什么也没查）。
          docker run --rm -i --entrypoint python chatagent:ci - <<'PY'
          from importlib import metadata
          targets = {"msgpack", "setuptools", "urllib3", "pillow", "rapidocr", "onnxruntime"}
          found = False
          for dist in metadata.distributions():
              name = (dist.metadata["Name"] or "").strip()
              if name.lower() in targets:
                  found = True
                  where = getattr(dist, "_path", "?")
                  print(f"{name}=={dist.version}  <- {where}")
          if not found:
              print("[自检] 一个都没找到（说明依赖没装进镜像）")
          PY
          echo "── 镜像里有没有 SBOM 类文件（trivy 会优先用它，从而与文件系统不一致）──"
          docker run --rm --entrypoint sh chatagent:ci -c \
            'find / -xdev \( -name "*.spdx.json" -o -name "*.cdx.json" -o -iname "*sbom*.json" \) 2>/dev/null | head -20; echo "[自检结束]"'

      # ⚠️ 从 v0.28.0 升到 v0.36.0（2026-11-06），原因是 **v0.28.0 已经坏了**，
      #    不是"顺手升个新版本"。它的 `action.yaml` 里写的是：
      #
      #        uses: aquasecurity/setup-trivy@v0.2.1     # ← 用可变 tag
      #
      #    而 `setup-trivy` 的 `v0.2.1` **已经被上游删除**（现存 v0.2.6 / v0.3.0 /
      #    v0.3.1）。于是报错发生在**解析 action 的阶段**：
      #
      #        Unable to resolve action `aquasecurity/setup-trivy@v0.2.1`,
      #        unable to find version `v0.2.1`
      #
      #    这一步在 `Set up job` 就失败了 —— 也就是说**镜像根本没构建、更没扫描**。
      #    与之前那次"写成 @0.28.0 而仓库只有 v0.28.0"是同一个坑的第二次发作：
      #    钉住自己的引用不够，**依赖链上下游的引用也得钉**，否则一个仍会被删。
      #
      #    v0.36.0 已经自己改好了（内部改用 SHA 钉 setup-trivy）：
      #
      #        uses: aquasecurity/setup-trivy@3fb12ec12f... # v0.2.6
      #
      #    这恰好印证了本文件开头那条规矩：**tag 可被上游重指/删除，SHA 不可变**。
      #    守卫：`tests/test_ci_config.py` 该补一条"上游 action 内部引用是否可解析"，
      #    但那是网络依赖，不适合放进离线测试，故只在此记录成因。
      - name: 漏洞扫描（镜像）
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: chatagent:ci
          format: table
          # 只卡 HIGH/CRITICAL：MEDIUM 及以下数量大且多数无法处置，
          # 全开会把门禁变成"习惯性失败"，反而把真正可修的问题淹掉。
          severity: HIGH,CRITICAL
          exit-code: "1"
          # 没有可用修复版本的 CVE 不该卡住 CI —— 你无法通过改代码解决它。
          # 需要长期忽略的**可修**项，请加到仓库根的 `.trivyignore`，
          # 并写明理由与到期日（见该文件的头部说明）。
          ignore-unfixed: true
          # ⚠️ 跳过 **pip 自带的 vendored 依赖清单**（2026-11-07 第五次真跑定位）
          # ------------------------------------------------------------------
          # 症状：报告里 msgpack 1.1.2 / setuptools 70.3.0 / urllib3 2.7.0 三条（共 5 个
          # 漏洞），而**同一份报告**的明细里 `msgpack-1.2.3.dist-info` / `-81.0.0` /
          # `-2.8.0` 全是 0 漏洞，构建日志也写着 `Successfully installed msgpack-1.2.3`。
          # 那三条挂在**不带路径**的聚合目标「Python」下 —— 一看就不像从文件系统读的。
          #
          # 真因：这几个包都是 **pip 自己 vendored 的副本**，而 pip 在 wheel 里带了一份
          # CycloneDX 清单：
          #     /usr/local/lib/python3.13/site-packages/pip/_vendor/bom.cdx.json
          # trivy 发现它后**按它列出的版本**去匹配漏洞库（同时警告 "Third-party SBOM
          # may lead to inaccurate vulnerability detection"），于是报的是 pip 打包那天
          # 冻结的 vendored 版本 —— 这也解释了"为什么两次构建报的是同一组旧版本"。
          #
          # 为什么不"把 msgpack 升到 1.2.3 了事"：**已经升了**，装的就是 1.2.3；
          # 要消掉这三条只能升 pip 本身（那是基础镜像的构建工具，不是我们的运行时依赖），
          # 而且下次基础镜像里 pip 再换代，同一处又会漂。
          #
          # 跳过的代价：**零**。我们真正装的每个包都有自己的 `*.dist-info/METADATA`，
          # trivy 照样逐个扫（报告里那些 `.../site-packages/xxx-1.2.3.dist-info/METADATA`
          # 行就是）。不装在 site-packages 顶层的 vendored 副本本来就不该被当成依赖。
          skip-files: "**/pip/_vendor/bom.cdx.json"

      - name: 清理容器
        if: always()
        run: docker rm -f chatagent-ci || true

  # ------------------------------------------------------------------
  # 5) 代码层安全：SAST / 依赖漏洞 / 密钥扫描
  # ------------------------------------------------------------------
  # 为什么与上面的 image job 分开
  # ---------------------------
  # image job 扫的是**镜像里装好的依赖**（trivy），本 job 扫的是**仓库里的代码与声明**。
  # 两者覆盖的东西不重叠：
  #   - trivy 看不到"代码里写死了一个密钥"——那不是 CVE；
  #   - pip-audit 看不到"基础镜像里的系统库漏洞"；
  #   - 两者都不知道"有人把 .env 提交上来了"。
  #
  # ⚠️ 门禁强度是**刻意分级**的，不是遗漏
  # -----------------------------------
  #   - **gitleaks 卡门禁**（唯一 exit≠0 的）：密钥泄露永远可修（删除 + 轮换），
  #     且代价最高 —— 凭据一旦进了仓库历史，改代码是补不回来的。
  #   - **bandit / pip-audit 只报不卡**：两者第一次跑必然命中**存量**问题 ——
  #     bandit 会命中 `src/rag` 里 7 处 `sha1`（那些是**内容指纹**，不是加密用途，
  #     bandit 的 B324 规则无法区分用途）；pip-audit 会命中任何一个"尚无可用修复
  #     版本"的传递依赖。直接卡门禁 ⇒ 第一次合入就是红的 ⇒ 接着必然被
  #     `continue-on-error` 或删掉绕过，**比不设门禁更糟**（它给了"有防护"的错觉）。
  #     正确顺序：先产出基线 → 逐条处置或写进带到期日的忽略清单（与
  #     `.trivyignore` 同一套纪律）→ **再把 exit 改成 1**。
  #     所以它们的结果以 artifact 形式留存，确保真的有人能拿到手看。
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: SAST（bandit，仅报告：先积累基线）
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install "bandit>=1.7"
          # -ll = 只报 MEDIUM 及以上；LOW 里几乎全是 assert / try-except-pass 这类噪声。
          # 跑两遍是为了同时拿到"给人看的文本"与"给机器看的 JSON"——
          # bandit 一次只能出一种格式，而只留 JSON 等于没人会打开它。
          bandit -r app src -ll -f json -o bandit-report.json || true
          bandit -r app src -ll || true

      - name: 依赖漏洞（pip-audit，仅报告：无修复版本的项无法靠改代码解决）
        continue-on-error: true
        run: |
          pip install "pip-audit>=2.7"
          # --no-deps：不做全量依赖解析（装齐 docling/torch 要十几分钟），只审
          # requirements.txt 里**直接声明**的包。传递依赖的权威口径是 image job
          # 里 trivy 扫**真实镜像**的结果 —— 那才是上线的东西。
          pip-audit -r requirements.txt --no-deps --desc || true

      - name: 密钥扫描（gitleaks，**卡门禁**）
        run: |
          set -eu
          VER=8.18.4
          # `--retry` 不是装饰：2026-11-08 那次 `security` 红在
          #   curl: (22) The requested URL returned error: 504
          # 上 —— 卡了 2 分钟之后 GitHub 的 release 下载返回 504。全仓库没有一行代码
          # 变化，门禁却红了。**但也不能把它改成 continue-on-error**：下载失败意味着
          # "这一次一条都没扫"，那不是"通过"，而是"没查"。所以正确的处置是——
          # 瞬时 5xx 重试，重试完还失败就照旧红（真·下载不了时门禁必须挡住发布）。
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          # ⚠️ 扫**全部 git 历史**（2026-10-05 改；此前是 `--no-git`，只扫当前工作树）
          # ----------------------------------------------------------------
          # 那时的理由写的是"历史里翻出的都是早已废弃的示例凭据，只会制造噪声"。
          # **这个理由在本仓库是错的**，而且错得很具体：历史里真的躺着两个可用的
          # 第三方 embedding 密钥（`rag/vectorSaveTest.py`，见 CHANGELOG）。
          # `--no-git` 让这条门禁**永远看不到它们** —— 于是"密钥不进仓库"这条
          # 最强的门禁，在它最该生效的那个场景里恰好失效了，且没有任何症状。
          #
          # 教训：允许清单/扫描范围这类"我刻意不扫某些东西，因为 X"的决定，
          # 必须拿数据验一遍 X。凭直觉判断"历史里大概只有噪声"是会错的。
          #
          # ⚠️ 这条红了怎么办：**不要**去放行，去处理。历史里的密钥只能靠
          #   ① 轮换（在对端控制台作废）+ ② 重写历史（git filter-repo + force push）
          #   两步解决；只删文件、只加 .gitignore 都不行 —— 对象还在 .git 里。
          #   步骤见 deploy/SECRETS.md 的「历史泄露处置」。
          #
          # 允许清单见仓库根 .gitleaks.toml。⚠️ 那里**故意没有**放行
          # `.env.example`：它是随仓库分发的公开模板，恰恰最容易被顺手粘进真密钥。
          ./gitleaks detect --source . --redact --config .gitleaks.toml -v

      - name: 上传扫描报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: security-reports
          path: bandit-report.json
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # 6) 发布：推送 registry → 生成 SBOM → 签名（**仅 main / 版本 tag**）
  # ------------------------------------------------------------------
  # 为什么必须有这一段
  # -----------------
  # 在此之前 CI 止于"构建 + 冒烟 + 扫描"，且刻意 `push: false` —— 于是
  # **构建过的东西 ≠ 部署过的东西**：发布靠人在服务器上 `compose up --build`
  # 重新构建一遍，那次构建用的代码/依赖/基础镜像都可能与 CI 验证过的不同，
  # 而且事后**没有任何记录**能回答"线上跑的到底是哪个 commit"。
  # 本 job 把"CI 验证过的那个镜像"变成唯一制品，并给它一个可验证的身份证（签名）。
  #
  # ⚠️ 依赖**全部**质量门禁 job：**没验证过的东西不许出门**。这才是 `needs:` 的
  #    真正意义 —— 不是"顺序好看"。逐条说清少了谁会出什么洞：
  #      · security  —— gitleaks 拦下一个提交进仓库的密钥、CI 变红，而镜像**照样发出**；
  #      · lint      —— ruff 抓到未定义名字 / 导入顺序错，镜像照样发出（那类错在运行期才炸）；
  #      · eval-gate —— 改提示词 / 换模型 / 调切分导致召回或答案质量退化，质量门禁红着
  #                     而镜像照样发出 ⇒ 线上质量静默下降，且事后无法归因到哪次发布；
  #      · bench     —— 热路径退化成 O(n)（限流器改成每请求扫全表 / 直方图退回存原始
  #                     观测值）：高基数下吞吐随客户端数下降、内存随 QPS 增长，而
  #                     错误率与 `_count` 看起来**完全正常** ⇒ 只能在线上先炸再查；
  #      · agent-session-pg —— 真库上的跨轮历史（落库 / 恢复）坏了，离线样例测试看不出来；
  #      · image / test —— 构建与冒烟本身。
  #    2026-10-06 修：原值是 `[image, test, security]`，上面三条全在门外 ——
  #    而这段注释当时就已经写着"没验证过的东西不许出门"，即**注释与实现不符**。
  #    守卫：`tests/test_ci_config.py::test_publish_depends_on_every_gate`，
  #    它按"所有在 push 事件下会跑的 job 都必须在 needs 里"**推导**（不写死清单），
  #    所以以后新增 job 会自动被纳入要求，不会静默过期。
  #
  # 缺凭据时的行为：**跳过而非失败**
  # ------------------------------
  # registry 登录放在一个"预检"步骤里：登不上就只打一条 warning 并跳过后续
  # 推送/签名，job 仍然成功。因为"仓库没启用 Packages / 组织策略禁止推送"属于
  # **配置缺失**，不是**代码坏了** —— 把它变红只会让每个合入都挂着一条与本次
  # 改动无关的红灯，然后被习惯性忽略。
  #
  # 用的是内置 `GITHUB_TOKEN`（配 `packages: write` 即可推 GHCR），
  # 所以正常情况下**不需要额外配任何密钥**；cosign 走 keyless（OIDC），
  # 也不需要私钥。要临时关掉发布：仓库变量 `PUBLISH_IMAGE=false`。
  publish:
    # 只在**打版本 tag**时发布：`git tag v1.2.0 && git push origin v1.2.0`。
    # 为什么不再跟着分支推送发（2026-11-08 改）：每次提交都产出一个镜像，
    # registry 会堆满从未上线的制品，"最新"变成噪音；而发布节奏应当由人决定。
    # ⚠️ 前提是 `on.push.tags` 里有 `v*` —— 少了那一行，本 job 永远等不到事件。
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
      && vars.PUBLISH_IMAGE != 'false'
    needs: [lint, test, agent-session-pg, eval-gate, bench, image, security]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write     # 推 GHCR 需要
      id-token: write     # cosign keyless 签名（走 OIDC，无需私钥）
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - name: 预检 registry 可用性（不可用则跳过，不判失败）
        id: pre
        run: |
          set -eu
          # ⚠️ 必须转小写。`github.repository` 保留仓库名的**原始大小写**
          # （本仓库是 `DaxiWhu/chatAgent-For-Exercise`），而 OCI / registry 的
          # 仓库名规范要求全小写，docker 会直接拒绝：
          #   invalid tag "ghcr.io/DaxiWhu/chatAgent-For-Exercise:sha-xxx":
          #   repository name must be lowercase
          # 这条只在**真的推送**时才炸，`docker build` 本地构建看不出来。
          # 2026-11-08 首次真跑发布即撞上（此前该 job 从未被触发过）。
          IMAGE="ghcr.io/$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          if echo "${{ secrets.GITHUB_TOKEN }}" \
               | docker login ghcr.io -u "${{ github.actor }}" --password-stdin 2>/dev/null; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
            echo "GHCR 登录成功：${IMAGE}"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "::warning::无法登录 GHCR（仓库可能未启用 Packages，或组织策略禁止推送）。已跳过发布 —— 这是配置缺失，不是代码问题。"
          fi

      - name: 计算镜像标签
        id: meta
        if: steps.pre.outputs.ok == '1'
        run: |
          set -eu
          IMAGE="${{ steps.pre.outputs.image }}"
          SHA_SHORT="$(git rev-parse --short=12 HEAD)"
          TAGS="${IMAGE}:sha-${SHA_SHORT}"
          # 本 job 只在 tag 事件上运行，所以这里只需要再打一个语义化版本号。
          # （原先还有一条"在 main 上同时打 :main"的分支：本仓库默认分支是 master、
          #  且已改为只按 tag 发布，那行永远不会成立 —— 死分支留着会让人以为
          #  存在一个滚动的 :main 指针。）
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then TAGS="${TAGS},${IMAGE}:${GITHUB_REF_NAME}"; fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          # sha-<短哈希> 才是**唯一可信的定位方式**：版本号 tag 可以被重指向，
          # 而"线上跑的到底是哪个 commit"必须能反查 —— 这正是本 job 存在的理由。
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "digest_tag=${IMAGE}:sha-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: 构建并推送镜像
        id: push
        if: steps.pre.outputs.ok == '1'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: deploy/app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # 与 CI 验证的镜像**同一构建参数**（slim 变体）—— 参数不一致就等于
          # "验证的"和"发布的"不是同一个东西，那前面所有验证都没有意义。
          build-args: |
            INSTALL_DOCLING=0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 生成 SBOM（软件物料清单）
        if: steps.pre.outputs.ok == '1'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ${{ steps.meta.outputs.digest_tag }}
          format: spdx-json
          output-file: sbom.spdx.json
          # 不自动传 GitHub Dependency Graph：那是另一套订阅（且对私有仓库有额外要求），
          # 这里只保证**制品旁边有一份 SBOM**，供漏洞响应时判断"我受不受影响"。
          upload-artifact: false

      - name: 安装 cosign
        if: steps.pre.outputs.ok == '1'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
      - name: 签名镜像（keyless，走 OIDC）
        if: steps.pre.outputs.ok == '1'
        run: |
          set -eu
          cosign sign --yes "${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}"

      - name: 附带 SBOM 到签名制品
        if: steps.pre.outputs.ok == '1'
        run: |
          set -eu
          # attach 之后 SBOM 与镜像 digest 绑定；签名已经签在 digest 上，
          # 因此"谁改了 SBOM"同样可被 cosign verify 的证明链发现。
          cosign attach sbom --sbom sbom.spdx.json \
            "${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}"

      # ----------------------------------------------------------------
      # 验签：证明"确实签上了、且能被验过"
      # ----------------------------------------------------------------
      # 为什么签完还要验一次 —— 只签不验等于没有签名保证：
      #   - 签错了对象（tag 而不是 digest）、身份/issuer 与预期不符、
      #     仓库没开 OIDC…… 这些情况下 `cosign sign` 可能仍然返回 0，
      #     而**使用方** `cosign verify` 时会失败。
      #   那时才会有人发现"这批镜像根本验不过"，而它已经在生产里跑了很久。
      # 这一步把"验签"从**消费方的期待**变成**发布方每次都要自证的条件**。
      #
      # 下面这两个参数同时是**给运维的验证命令模板** —— 部署前请用同一条命令核对
      # 你要拉的那个 digest（换掉 IMAGE@DIGEST）：
      #   cosign verify \
      #     --certificate-identity-regexp '^https://github.com/<org>/<repo>/\.github/workflows/ci\.yml@' \
      #     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
      #     IMAGE@DIGEST
      # ⚠️ identity 用 regexp 而不是精确串：它含 **run 的 ref**（分支/tag），
      #    精确串会在每次换分支时失效；而"只验 issuer 不验 identity"又等于没验 ——
      #    任何人都能用自己仓库的 workflow 签一个同名镜像。
      - name: 验证签名（发布方自证 + 给运维的命令模板）
        if: steps.pre.outputs.ok == '1'
        run: |
          set -eu
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/ci\.yml@" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}"
          echo "签名验证通过：${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}"

      - name: 上传 SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom
          path: sbom.spdx.json
          if-no-files-found: ignore

      - name: 发布摘要
        if: always()
        run: |
          {
            echo "## 发布结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 镜像 | \`${{ steps.pre.outputs.image }}\` |"
            echo "| 标签 | \`${{ steps.meta.outputs.tags }}\` |"
            echo "| digest | \`${{ steps.push.outputs.digest }}\` |"
            echo "| registry 可用 | ${{ steps.pre.outputs.ok }} |"
            echo ""
            echo '校验签名（部署前应逐次执行，确认拿到的是本仓库签出的镜像）：'
            echo ""
            echo '```'
            echo "cosign verify \\"
            echo "  --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.*' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  ${{ steps.meta.outputs.digest_tag }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

