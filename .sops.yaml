# SOPS 配置 —— 决定"哪个文件用哪把钥匙加解密"。
#
# 为什么放在仓库根
# --------------
# `sops` 从**当前工作目录向上**逐级查找 `.sops.yaml`，用找到的第一份。放根目录
# ⇒ 在项目里任何位置敲 `sops` 都命中同一套规则，不会因为"命令在哪个目录执行的"
# 而用错钥匙（那类故障的表现是：加密出来的文件连你自己也解不开）。
#
# 三条来自 sops 源码、不写下来就一定会踩的行为（都已实测，见 `tmp_probe/sops_probe.py`）
# -------------------------------------------------------------------------------
# 1. **匹配的是"相对于本文件所在目录"的路径**，不是绝对路径 ——
#    `config.parseCreationRuleForFile` 会先做 `TrimPrefix(abs, configDir+sep)`。
#    所以下面写 `^secrets/...`，而不是 `^/some/abs/secrets/...`。
# 2. **用的是 Go 的 `regexp.MatchString`：子串匹配、大小写敏感、不自动加锚点。**
#    所以开头的 `^` 是**承重**的：少了它，`vendor/secrets/x` 这类无关路径也会命中
#    （本文件的规则就会去加密别人的密钥文件）。
#    结尾的 `$` 在本规则里不承重（尾巴是 `.+`，加不加匹配同一批路径），
#    写着是为了让规则的边界一眼可见 —— 与其编一条"少了它会怎样"的理由，
#    不如说清楚它在这里的实际作用。
# 3. **Windows 上参与匹配的字符串带的是反斜杠** —— `--filename-override` 的值会被
#    先过一次 `filepath.Abs`（见 `cmd/sops/main.go`），Windows 的 `Abs` 产出 `\`。
#    **实测**：把下面的正则改成只认斜杠的 `^secrets/.+$`，加密立刻失败并报
#    "no matching creation rules found" —— 也就是说，只写 `/` 的话这条配置
#    在 Windows 上**一次都不会生效**。所以分隔符写成 `[/\\]`：两种都接受，
#    同一份配置在两个平台上都成立。
#
# ⚠️ 这里只有**公钥**。私钥在 `age-keygen` 的默认位置
#    `~/.config/sops/age/keys.txt`，**绝不进仓库**。"谁能解密"由私钥发给谁决定，
#    不由本文件决定 —— 所以公开本文件是安全的：它公开的正好是"收件人地址"。

creation_rules:
  # 覆盖 `secrets/` 下的**所有**文件，而不是只点名 `app.sops.env`。这样以后要把
  # 别的密文收进来（比如 alertmanager 的 webhook 口令）时不必再改本文件 ——
  # "改配置要记得改两个地方"这件事，一定会有一次漏改。
  #
  # ⚠️ 文件名**必须以 `.env` 结尾**，这不是风格问题。sops 靠**后缀**推断输入输出
  #    格式（`cmd/sops/formats.FormatForPath` 只认 `.yaml` / `.yml` / `.json` /
  #    `.env` / `.ini`，**其余一律落到 Binary**）。实测两种后缀的差别：
  #
  #      `app.sops.env`（后缀 .env ⇒ Dotenv）：
  #          AGNES_API_KEY=ENC[AES256_GCM,data:...]      ← 逐键一个信封
  #      `app.env.enc`（后缀 .enc ⇒ Binary）：
  #          { "data": "ENC[AES256_GCM,data:...]", "sops": { ... } }   ← 整块一坨
  #
  #    两种都**能解回来**（实测逐字节还原），差别在**粒度**：二进制形态下
  #    看不到文件里有哪些键、没法用 `sops set` 按单键增删改、diff 也只能看出
  #    "整个文件变了"而看不出改的是哪一条密钥。以后要换密钥、加租户，
  #    这些都是每天要做的事 —— 所以后缀必须是 `.env`。
  #
  #    `app.sops.env` 这个命名同时满足三件事：后缀 `.env` ⇒ Dotenv；名字里的
  #    `sops` ⇒ 一眼看出是密文；**不以 `.env.` 打头** ⇒ 不会被 `.gitignore` 的
  #    `.env.*` 吃掉（那条模式不带斜杠，匹配**任意层级**的文件名）。
  - path_regex: '^secrets[/\\].+$'
    # ⚠️ 占位符。跑完 `age-keygen` 后把公钥（`age1` 开头）粘到这里。
    #    留着占位符时 `sops -e` 会**直接报错**（不是静默用错钥匙），所以它不是隐患。
    #    守卫在 `tests/test_secrets_config.py`：一旦 `secrets/` 下真的出现了密文，
    #    本行就必须已经换成真公钥 —— 防的是"加密了但配置没更新，下次谁也解不开"。
    age: AGE_PUBLIC_KEY_PLACEHOLDER
