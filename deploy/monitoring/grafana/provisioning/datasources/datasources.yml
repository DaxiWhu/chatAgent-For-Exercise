# Grafana 数据源自动配置
#
# 为什么要自动配置而不是手工在 UI 里点：手工加的 datasource **只存在于容器卷里**，
# 容器一重建就没了（表现是"面板全部报 datasource not found"，而排查的人会
# 先去怀疑 Prometheus 挂了）。写进 provisioning 就随仓库进版本管理。
#
# 两个数据源对应两类问题：
#   Prometheus —— "哪一刻开始坏的、坏在哪条路由"（指标，聚合与趋势）
#   Loki       —— "那次请求具体发生了什么"（日志，单条链路与报错栈）
# 排查顺序通常是：告警 → Prometheus 定位时间与路由 → Loki 按 request_id 看细节。

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    # 与 prometheus.yml 的 scrape_interval 保持一致：
    # 不一致时 Grafana 会按更密的步长采样，把阶梯状曲线画成假的锯齿。
    jsonData:
      timeInterval: 30s

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
