# chatAgent 告警规则
#
# 分四组，按"该谁被叫醒"划分：
#   availability —— 服务没了/错误率失控，立刻处理（critical）
#   slo          —— 错误预算燃尽过快，按 SLO 承诺处置（见同目录 SLO.md）
#   cost         —— 额度与成本异常，当天处理（warning）
#   security     —— 越权尝试，**任何一次都值得看**（critical）
#
# 每条都带 runbook：告警最怕的不是响，而是响了没人知道下一步做什么。
#
# ⚠️ 标签值的**书写格式**必须与 `app/metrics.py` 实际渲染出来的一致
#    （例：桶边界渲染成 `le="1.0"` 而不是 `le="1"`）。PromQL 的正则与相等匹配
#    都是全串匹配，写错一个字符的后果是**告警永远不触发**且没有任何报错 ——
#    `tests/test_monitoring_config.py` 里有专门一条断言把这个格式钉住了。

groups:
  # =========================================================================
  # 可用性
  # =========================================================================
  - name: chatagent-availability
    rules:
      - alert: ChatAgentDown
        # up 是 Prometheus 自带的"抓取是否成功"。持续 2 分钟才算，
        # 避免一次抓取抖动就叫人起床。
        expr: up{job=~"chatagent-.*"} == 0
        for: 2m
        labels:
          category: availability
          severity: critical
        annotations:
          summary: "实例 {{ $labels.instance }}（{{ $labels.release }}）抓取失败"
          description: "服务无响应或 /metrics 不可达，已持续 2 分钟。"
          runbook: "1) docker logs 看进程是否活着；2) curl /health/live 区分'进程死'与'只是 /metrics 被拒'; 3) 若进程活着但探针失败，看 /health/ready 的 checks 明细。"

      # 限流的 IP 维度发现"一个对端地址背后有很多个不同用户"。
      # 为什么值得一条告警：这两种形态的症状完全一样（一个桶被很多人共用），
      # 而其中"反代配了但 TRUST_PROXY_HEADERS 没开"是**可以修的**，且不修的话
      # 一个人就能把所有人挡在登录外面（登录接口也在同一个桶里）。
      # 只看 trusted="no"：trusted="yes" 那种是 NAT/网关，改配置解决不了，日志里的
      # warning 足够，不该再往告警通道塞。
      - alert: RateLimitSharedEgressWithoutTrustedProxy
        expr: increase(ratelimit_shared_egress_total{trusted="no"}[30m]) > 0
        for: 0m
        labels:
          category: availability
          severity: warning
        annotations:
          summary: "限流 IP 维度检测到共享出口，且未开启 TRUST_PROXY_HEADERS"
          description: "同一个对端地址背后出现了多个不同用户 ⇒ 这批人的按 IP 额度是**共用一份**的：一个人刷满，其余人（含 `POST /v1/auth/login`）全部 429。最常见的原因是应用在反向代理后面但 `TRUST_PROXY_HEADERS` 没打开，于是每个请求的客户端地址都是那台代理。"
          runbook: "1) 确认部署形态：前面有反代/网关 ⇒ 设 `TRUST_PROXY_HEADERS=1` 并重启（应用改从 X-Forwarded-For 取真实客户端地址）；直连却出现多个主体 ⇒ 查是不是有中间设备在改对端地址；2) 确认代理是**覆盖式**写 XFF（`proxy_set_header X-Forwarded-For $remote_addr;`）—— 追加式写法下最左段是客户端可控的，等于限流可被伪造绕过（守卫见 tests/test_deploy_topology.py）；3) 改完看本告警是否消失、`rate_limited_total{scope=\"ip\"}` 是否回落；4) 若确认是 NAT（已开 TRUST_PROXY_HEADERS 仍报）⇒ 那是 trusted=\"yes\" 那条路径，改提 `RATE_LIMIT_PER_MINUTE` 或按出口人数评估。"

      - alert: ChatAgentReadinessDegraded
        # readiness 失败只会摘流量、不重启容器 —— 但如果一直摘着，
        # 说明实例实际上没在服务（可能被 LB 剔除了却没人注意）。
        expr: increase(http_errors_total{status="503"}[10m]) > 3
        for: 5m
        labels:
          category: availability
          severity: warning
        annotations:
          summary: "就绪探针持续返回 503"
          description: "10 分钟内出现 {{ $value }} 次 503，说明 /health/ready 的某个依赖不健康。"
          runbook: "curl localhost:8000/health/ready | python -m json.tool，看 checks 里哪一项 ok=false（llm / db / vector_store / checkpointer）。"

      - alert: HighErrorRate
        # 用 uptime 做分母保护：0 流量时不报警（否则重启后必误报）
        expr: |
          rate(http_errors_total[5m])
          / clamp_min(rate(http_requests_total[5m]), 0.001) > 0.05
        for: 5m
        labels:
          category: availability
          severity: critical
        annotations:
          summary: "5xx 比例过高（> 5%）"
          description: "当前错误率 {{ $value | humanizePercentage }}，受影响路由见 error 指标明细。"
          runbook: "按 path 标签定位路由，再查结构化日志里的 request_id 串起整条链路（日志已带 request_id，可直接 grep）。"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
          ) > 10
        for: 10m
        labels:
          category: availability
          severity: warning
        annotations:
          summary: "P95 延迟超过 10 秒"
          description: "当前 P95 = {{ $value }}s。注意 SSE 长连接会天然拉高尾部延迟，请结合 llm_tokens_per_request 判断是不是生成变慢了。"
          runbook: "若同时 llm_tokens_per_request 上升 ⇒ 模型产出变长/变慢；若只有延迟高 ⇒ 查数据库与检索（rerank 熔断是否打开）。"

      - alert: ConcurrencyShedding
        # 背压真的在拒人时的信号。`reason` 标签把"并发满"与将来可能新增的
        # 其它拒绝原因分开 —— 混在一起会让"该加副本"和"该改配额"分不清。
        expr: rate(http_requests_rejected_total{reason="concurrency"}[5m]) > 0.1
        for: 5m
        labels:
          category: availability
          severity: warning
        annotations:
          summary: "实例并发已满，正在拒绝新请求（{{ $value | humanize }} req/s）"
          description: "在途请求长期贴着 MAX_CONCURRENT_REQUESTS 上限，新请求收到 503 + Retry-After。这不是'挂了'（进程、依赖都正常），是**容量不够**。"
          runbook: "1) 看面板『chatAgent · 服务总览』的『并发饱和率』，接近 100% 即确认；2) 先判断是不是被刷（同 IP/同 Key 的请求速率、是否大量长连接不关）——是则临时收紧限流；3) 否则按 CAPACITY.md 加副本，或调大 MAX_CONCURRENT_REQUESTS（**先确认内存与上游配额扛得住**）；4) 已确认是攻击时不要急着调大上限，那只会把上游一起拖垮。"

      - alert: ConcurrencySaturated
        # 比上面那条**早一步**：还没开始拒人，但余量已经耗尽。
        # 有它才能在"用户开始收到 503"之前动手。
        expr: |
          http_concurrency_in_flight
          / clamp_min(http_concurrency_limit, 1) > 0.8
        for: 10m
        labels:
          category: availability
          severity: warning
        annotations:
          summary: "并发用量长期高于上限的 80%"
          description: "在途 {{ $value | humanizePercentage }} 于 MaxConcurrency 上限，余量已不足。上限未配置时本指标不存在，这条规则不会触发（那是刻意的：没有闸门就没有饱和可言）。"
          runbook: "同 ConcurrencyShedding，但现在是『还有时间从容处理』的窗口：先看是常态增长还是突发，再决定加副本（推荐）还是调上限。"

      - alert: EventLoopBlocked
        # 事件循环被**同步调用**占住 —— 这段时间里**所有**并发请求都停着。
        #
        # 为什么需要一条专属信号：它**不产生任何错误**（错误率保持 0），唯一的表现是
        # 延迟上升；而延迟上升的原因有几十个，只看 P95 分不出是哪一种。没有这个指标，
        # "卡住了"与"慢"在面板上长得一模一样。
        #
        # 口径：`_sum` 是"被阻塞的总秒数"，对它 rate 出来就是**阻塞时间占比**（秒/秒）。
        # `_count` 只统计超过 50ms 的事件（阈值依据见 `app/loopwatch.py` 的实测：
        # Windows 上空载 P99 约 15ms，取 50ms 是它的 3 倍余量），因此这个比值
        # **不含调度抖动** —— 不然 Windows 上每一次心跳都会被算成阻塞。
        #
        # ⚠️ 5% 是**起点，不是标定值**：探针是新增的，生产基线还没测过
        # （见 `deploy/CAPACITY.md` 待补清单）。若长期误报，先看 `event_loop_lag_seconds`
        # 的分位再调阈值，别直接把它关掉。
        expr: sum(rate(event_loop_lag_seconds_sum[10m])) > 0.05
        for: 10m
        labels:
          category: availability
          severity: warning
        annotations:
          summary: "事件循环至少有 5% 的时间被阻塞（当前 {{ $value | humanizePercentage }}）"
          description: "有同步调用跑在事件循环上 ⇒ 所有并发请求一起卡住，而错误率保持 0。这类变慢在延迟面板上只表现为『变慢了』。"
          runbook: "1) 看 `event_loop_lag_seconds` 的 P99 与 max：单次数百毫秒的尖峰 ⇒ 某个同步调用；持续的小值 ⇒ 高频小阻塞（日志、序列化、**GC**）—— 后者对照 `python_gc_collections_total` 的增速与 `process_resident_memory_bytes` 是否同步上涨（堆在变大 ⇒ 每次 GC 越来越重；第 2 代计数也在涨说明有对象活过了两轮回收，那通常就是泄漏），再看 `python_gc_collected_objects_total`：回收次数在涨而回收对象数不涨 ⇒ GC 在**空转**，该找引用链而不是调 GC 阈值。2) 用 `process_cpu_seconds_total` 与 `process_uptime_seconds` 的比值判断『在算还是在等』：接近核数 ⇒ 真在算；远低于核数 ⇒ 主要在等 I/O 或等上游，那就不是本告警的范畴。3) 对照部署时间 —— 本告警从零变成持续 >0 的时刻，通常就是引入同步调用的那次发布。4) 找法：`tests/test_event_loop_offload.py` 守的是**已知**调用点，新增路径要自己查，优先看最近新增的工具、压缩路径、以及任何在 `async def` 里直接读写文件或调同步客户端的地方。5) 修法是把阻塞调用移到线程里（`asyncio.to_thread`），**不是**调大并发上限 —— 那只会让更多请求一起等。"

      - alert: StreamErrorsHigh
        expr: rate(chat_stream_errors_total[5m]) > 0.2
        for: 5m
        labels:
          category: availability
          severity: critical
        annotations:
          summary: "SSE 流式生成频繁报错（kind={{ $labels.kind }}）"
          description: "chat/review 流在中途抛异常。典型成因：检查点后端故障、模型超时或配额被拒。"
          runbook: "查日志里的 '流异常' 与堆栈；重点看 DB_URL 连通性与 AGNES_API_* 是否可用。"

      - alert: ExternalProbeFailing
        # 黑盒探活：blackbox-exporter 从**外部**请求入口（见 prometheus.yml 的
        # blackbox-chatagent job）。与 ChatAgentDown 的分工很关键：
        #   ChatAgentDown      —— Prometheus 抓不到 /metrics ⇒ "容器内进程可能死了"
        #   ExternalProbeFailing —— 外部探入口失败      ⇒ "用户那条路断了"
        # 后者才覆盖 nginx 配置错、端口没发布、DNS 失败、被限流拦在外面的情形 ——
        # 那时 ChatAgentDown **不会**触发（容器好好的、Prometheus 抓得到），
        # 但用户已经完全用不了了。
        expr: probe_success{job="blackbox-chatagent"} == 0
        for: 2m
        labels:
          category: availability
          severity: critical
        annotations:
          summary: "外部探活失败（{{ $labels.instance }}）"
          description: "从 blackbox-exporter 侧发起的 HTTP 探测连续 2 分钟失败，说明**外部访问链路**（入口/网络/端口）有问题，而不是应用内部。"
          runbook: "1) 先在服务外手工 `curl -i <入口>/health/ready` 复核，确认不是探测侧问题；2) 对比 `curl localhost:8000/health/ready` 的 checks 明细 —— 内部正常而外部失败 ⇒ 一定是入口/网络层；3) 查 nginx 容器日志与最近一次入口配置变更（nginx.conf / 端口映射 / 安全组）。"

      - alert: TLSCertExpiringSoon
        # 证书过期是最"准时"的故障：必然发生，且可以提前几十天发现。
        # probe_ssl_earliest_cert_expiry 是 blackbox 给出的**到期时间戳**，
        # 减 now() 得到剩余秒数。只在启用 https_2xx 探活后才有数据 ——
        # 没有该 job 时这条规则永远 inactive（不是故障，是还没开 TLS 探活）。
        expr: probe_ssl_earliest_cert_expiry{job=~"blackbox-.*"} - time() < 30 * 24 * 3600
        for: 1h
        labels:
          category: availability
          severity: warning
        annotations:
          summary: "入口 TLS 证书将在 30 天内到期"
          description: "{{ $labels.instance }} 的证书剩余时间不足 30 天。若不处理，到期当天全站会被浏览器直接拦截（内部指标一切正常）。"
          runbook: "1) 确认证书签发方式（Let's Encrypt 自动续期 / 手工上传）；2) 自动续期的话先查续期任务是否失败（这是最常见的原因）；3) 手工证书则走一次替换流程，并用 `openssl s_client -connect <域名>:443 2>/dev/null | openssl x509 -noout -dates` 复核。"

      - alert: IndexIdentityMismatch
        # 库里存着的向量与当前 `EMBEDDING_MODEL` **不是同一个模型灌的**。
        # 最隐蔽的一种是"换了模型但维度没变"（1024 → 1024）：旧向量还在、
        # 新查询用新模型编码，两者落在**不同的向量空间**里，检索命中当场变形，
        # 而 QPS / 延迟 / 错误率**全部正常** —— 没有任何别的信号能反映它。
        # 指标由启动自检写（`app/main.py::_report_index_identity`），
        # 判定逻辑在 `src/rag/index_identity.py`。
        expr: rag_index_identity_ok == 0
        for: 5m
        labels:
          category: availability
          severity: warning
        annotations:
          summary: "向量库的索引身份与当前 embedding 模型不一致"
          description: "启动自检发现库里既有向量是用**另一个** embedding 模型（模型名或维度不同）灌的，而当前 `EMBEDDING_MODEL` 指向新模型。旧向量与新查询不在同一个向量空间 ⇒ 检索命中明显变差、答案开始答非所问，但吞吐与错误率一切正常。`/health/ready` 的 vector_store 明细里有库里的与当前的模型名、维度。"
          runbook: "1) 看启动日志里 `索引身份自检：status=mismatch` 那一行，它分别打印**库里的**与**当前的**模型名与维度；2) 若确实换过模型：把 `QDRANT_COLLECTION` / `PGVECTOR_TABLE` 改成一个新名字后重新灌库（旧集合/表**先保留**，以便比对与回滚），灌完确认 `rag_index_identity_ok` 变回 1；3) 若是误报（只是模型名写法变了，如大小写/前缀）：把库里 `embedding_fingerprint` 那条记录改成当前指纹即可。⚠️ **不要**为了让告警消失而直接删掉那条记录 —— 那等于把这项检查永久关掉。"

      - alert: CitationUnsupportedFrequent
        # 答案里出现了**不存在的引用编号**（例如标了 `[7]` 而本轮只用 7 条命中的前 3 条）
        # —— 这是可以用代码证明的"编造引用"，而不是主观判断。
        #
        # ⚠️ 当前 `answer_prompt` **没有要求**模型标编号 ⇒ 多数部署下这条**不会响**。
        #    这是刻意的：它守的是"模型开始自发标编号，并且标错"（换模型/改提示词之后
        #    很常见），以及将来提示词演进出强制引用之后的常态监控。
        #    一条"偶尔才响、一响就是真的"的告警，比一条常年噪音的告警有用得多。
        expr: increase(citation_check_unsupported_total[1h]) > 5
        for: 10m
        labels:
          category: availability
          severity: warning
        annotations:
          summary: "1 小时内出现 {{ $value }} 次编造引用"
          description: "`citation_check_unsupported_total` 在涨：模型在答案里标了**本轮检索命中里不存在**的引用编号。用户会照着这个编号去核对出处，而它指向的东西不存在 —— 比「没有引用」更糟，因为它让人以为有据可查。响应里的 `citation_check` 事件带 `refs` 与 `missing`，可直接定位是哪几个编号。"
          runbook: "1) 从日志搜 `引用校验未通过`，看 `refs` 是哪几个编号、本轮命中了几条；2) 常见成因是**换了模型或改了提示词**后模型开始自己编号 —— 先确认 `PROMPT_VERSION` 与 `EMBEDDING_MODEL` 是否有人动过；3) 若已配 `RAG_CITATION_CHECK_ACTION=block`，这类回答的引用会被吞掉（答案照常返回），核对「消失的引用」是否都是这一类；4) 若模型只是编号习惯不同（比如把整段引用写成 `[资料1]`），那不是本告警的范畴 —— 本告警只认数字编号。"

      - alert: IndexIdentityNeverReported
        # "没检出问题"与"根本没检查"必须能区分开 —— 这是本项目反复踩的一类假绿。
        # 用持久化向量后端（pg / qdrant）时，启动自检**必然**会写下这个指标；
        # 它缺席就说明那次自检没有跑成（抛异常、或后端参数错到读不了库）。
        # 条件里的第二项只为不误报：只在"确实有实例被抓取着"时才说这件事。
        expr: absent(rag_index_identity_ok) and on() (count(up{job=~"chatagent-.*"} == 1) > 0)
        for: 15m
        labels:
          category: availability
          severity: warning
        annotations:
          summary: "索引身份自检从未上报过结果"
          description: "没有任何 `rag_index_identity_ok` 序列，但有实例正在被抓取（`up == 1`）。持久化向量后端下启动自检一定会写这个指标 —— 它缺席意味着**这项检查根本没在跑**，于是上一条 `IndexIdentityMismatch` 永远不会响，而外观全绿。"
          runbook: "1) 在启动日志里搜 `索引身份自检`：**完全没有这一行** ⇒ `app/main.py::_report_index_identity` 没被调或抛异常（它会打 WARNING，一并看）；2) **有这一行**但 `status=unknown` ⇒ 表/集合还没建（首次灌库之前属正常，灌完就会变成 recorded）；`status=error` ⇒ 自检读不到向量库，按日志里的异常修连接参数；3) 确认 `RAG_VECTOR_STORE` 不是 `memory` —— 内存后端天然没有索引身份，生产不该用它。"

      - alert: SharedBackendDegraded
        # 多副本下 Redis（限流 / 配额 / 幂等的共享后端）不可达时，实现会**退到
        # 进程内计数**以保证"仍然会拦"，但各副本各算各的 ⇒ 额度实际被放宽 N 倍。
        # 这是最需要告警的一类：**保护机制失效，而服务一切正常** —— 请求成功率、
        # 延迟、错误率全都看不出任何异常，限流看起来也仍在工作。
        expr: increase(shared_backend_errors_total[15m]) > 0
        for: 5m
        labels:
          category: availability
          severity: warning
        annotations:
          summary: "共享后端降级为进程内计数（component={{ $labels.component }}）"
          description: "近 15 分钟有 {{ $value }} 次共享后端（{{ $labels.backend }}）调用失败，已退到进程内计数。单副本下只是「计数更准一点」，**多副本下等于把限流/日配额放宽到副本数倍**。"
          runbook: "1) 按 component 定位：quota ⇒ 查日额度是否被刷穿；ratelimit ⇒ 查是否有来源绕过了限流；2) `redis-cli -h <host> ping` 与 `INFO clients` 确认 Redis 是挂了、还是连接数打满；3) 恢复后**核对这段时间的实际消耗**（日志里的「配额拒绝」与限流触发次数），必要时人工追溯；4) 检查 `REDIS_URL` —— 限流 / 日配额 / 幂等**共用这一个键**，指错地址或不可达时三者会同时静默退化。"

      - alert: RequestTimeoutFrequent
        # 请求级总时限（REQUEST_TIMEOUT_SECONDS）被顶掉：流被终止、用户拿不到完整回答。
        # 它**不会**产生 5xx（已经下发了部分正文），所以 HighErrorRate / SLO 都看不见它 ——
        # 不单独看这条就只剩用户投诉这一条路径。
        expr: increase(request_timeout_total[15m]) > 3
        for: 5m
        labels:
          category: availability
          severity: warning
        annotations:
          summary: "请求频繁触及总时限（kind={{ $labels.kind }}）"
          description: "近 15 分钟有 {{ $value }} 次请求因总时限耗尽被终止（响应已开始，故不计入 5xx）。"
          runbook: "1) 先看 `llm_first_token_seconds` 与 `llm_call_duration_seconds`：首字节慢 ⇒ 上游模型；调用慢 ⇒ 上游整体抖动；2) 看 `rag_stage_duration_seconds` 排除检索段；3) 三者都正常 ⇒ 是 REQUEST_TIMEOUT_SECONDS 配得偏紧（对照 `llm_tokens_per_request` 的 P95 判断合理值）；4) 若确实需要更长，改配置时**同步确认**前端与网关的超时都比它长。"

      - alert: RagRetrievalDegraded
        # 检索抛异常后**降级为无上下文继续作答**：接口 200、答案照出，只是没有引用。
        # 过去这里只有一行 warning，于是"检索一直失败"在指标上完全看不出来。
        expr: increase(rag_retrieval_degraded_total[15m]) > 0
        for: 5m
        labels:
          category: availability
          severity: warning
        annotations:
          summary: "检索失败并降级为无上下文（stage={{ $labels.stage }}）"
          description: "近 15 分钟有 {{ $value }} 次检索整体失败（stage=graph_retrieve 为主链路，agent_search 为 agent 链路）。用户拿到的是「没有依据」的回答，而**服务零报错**。"
          runbook: "1) 看 `circuit_open`：若同时为 1，先按那条处置（熔断打开时降级是**预期行为**）；2) 否则查 embedding 网关连通性与 `EMBEDDING_API_KEY`；3) 结合 `rag_stage_duration_seconds` 判断是 embed 段还是 vector 段；4) 语料目录未挂进容器也会走到这里（看启动日志的「RAG 语料为空」）。"

      - alert: RetrievalCircuitOpen
        # 熔断器打开 ⇒ 出站调用被快速失败 ⇒ 调用方走降级分支（检索回退融合顺序）。
        # 全过程没有异常抛出、没有 5xx，**只有这个 gauge 能反映它**。
        expr: circuit_open == 1
        for: 5m
        labels:
          category: availability
          severity: warning
        annotations:
          # ⚠️ 标签名是 `breaker` 而**不是** `name`：`app/metrics.py` 的读写函数
          #    第一个形参就叫 `name`，标签再叫 `name` 会在**调用点**当场抛
          #    TypeError（探针确认：异常抛在观察函数自身，兜底 except 轮不到）。
          #    熔断器的播报点在 `record_success`（每次成功都走），于是异常会穿透
          #    `guarded_call` 让检索整体降级 —— 指标一条不存在，业务还跟着坏。
          summary: "出站熔断器未闭合（{{ $labels.breaker }}）"
          description: "熔断器 {{ $labels.breaker }}（rerank / embedding）已连续失败到阈值并打开。此后每次调用**不发出请求、直接失败**，由调用方降级：检索回退到融合顺序、精排被跳过。用户侧的感知是「排序变差」「答案依据不足」，而面板上的错误率完全正常。"
          runbook: "1) 看 `circuit_opened_total` 的增长速率与 `circuit_rejected_total`（省下了多少次白等）；2) 查上游网关健康与配额：rerank ⇒ RERANK_MODEL / RERANK_API_KEY；embedding ⇒ EMBEDDING_MODEL / EMBEDDING_API_KEY；3) 半开状态也会让本告警保持 firing —— 那表示上游**还没真正恢复**，不要为了让告警消失而调大 `CIRCUIT_FAIL_THRESHOLD`；4) 恢复后 gauge 会自行变 0，确认 `rag_stage_duration_seconds{stage=...}` 的量级回到基线。"

      - alert: FirstTokenTooSlow
        # ★ 流式服务里第一个该看的用户体验指标。端到端延迟（http_request_duration_seconds）
        #   覆盖整段生成，天然被"回答有多长"主导 —— 它快慢说明不了"用户等了多久才看见第一个字"。
        #   这正是 `client_disconnected_total` 高企（用户没耐心）最常见的成因。
        expr: |
          histogram_quantile(0.95,
            sum(rate(llm_first_token_seconds_bucket{mode="stream"}[10m])) by (le)
          ) > 8
        for: 10m
        labels:
          category: availability
          severity: warning
        annotations:
          summary: "首字节延迟 P95 超过 8 秒（{{ $labels.kind }}）"
          description: "近 10 分钟流式请求的首字节 P95 = {{ $value }}s。用户在这段时间里看到的是一个空白的回答区。只看 `mode` 为 stream 的那一档：非流式链路（agent 链路整段返回）的「首字节」其实是整段生成耗时，混进同一个分位数会让这个数失去含义。⚠️ 这条只管「第一个字等了多久」：首 token 正常、但用户抱怨「答到一半卡住」的情况**不在它覆盖范围内**，要看 `llm_inter_chunk_seconds`（相邻 chunk 的间隔，见 RUNBOOK 同名条目）。"
          runbook: "1) 先分诊：看 `rag_stage_duration_seconds`（检索是不是慢了）、`llm_call_duration_seconds`（模型调用是不是慢了）、以及 `agent_history_compaction_seconds`（跨轮历史压缩的那次摘要调用）。最后这条容易被漏掉：它压在首 token 之前，但**只在历史超过预算时才发生**，所以整体 P95 里几乎看不见它 —— 要单独看它的分布，并用 `result=error` 那一档区分『压得慢』与『压失败后白等一次超时』；2) 三者都正常 ⇒ 问题在**排队/并发**：看 `http_concurrency_in_flight / http_concurrency_limit` 与 `rate_limited_total`；3) 若同时 `client_disconnected_total` 在涨，说明用户已经在关页面了，优先处理；4) 对照 `llm_tokens_total` 排除「上游整体过载」。"

      - alert: LlmCallErrorsHigh
        # 模型调用**独立**的失败率。没有它时，上游抖动只能透过
        # `chat_stream_errors_total` 与 `agent_runs_total{exit_reason=error}` 间接看到 ——
        # 而这两者都会被重试与"兜底话术"吃掉一部分，系统性低估真实失败率。
        # 分母用 `llm_call_duration_seconds_count`：每次调用（成功或失败）都会计时，
        # 因此它与分子的口径天然一致。
        expr: |
          rate(llm_call_errors_total[10m])
          / clamp_min(rate(llm_call_duration_seconds_count[10m]), 0.001) > 0.1
        for: 10m
        labels:
          category: availability
          severity: warning
        annotations:
          summary: "模型调用失败率超过 10%"
          description: "当前失败率 {{ $value | humanizePercentage }}。stage=evaluate 高 ⇒ 评审环节（有重试兜底，会推高返工）；stage=answer/revise 高 ⇒ 用户直接拿不到答案；stage=step_* ⇒ agent 链路。"
          runbook: "1) 按 stage 定位环节；2) 看 `llm_call_duration_seconds` 的分布 —— 失败集中在超时（≈timeout 上限）说明上游变慢，否则更可能是 4xx/协议错误（查 `AGNES_API_BASE` 与模型名）；3) 同时看 `llm_budget_exceeded_total` 排除「预算被顶掉被误记成失败」；4) 若为 agent 链路，对照 `agent_runs_total{exit_reason}` 的分档。"

      - alert: CheckpointErrorsHigh
        # 检查点（LangGraph 持久化）读写失败。它是**硬依赖**：失败意味着会话状态
        # 读不到/写不进，表现为"续跑拿到旧状态"或"卡住"，而 HTTP 可能仍是 200。
        # `/health/ready` 的 checkpointer 项是**启动探针**，答不了运行期的读写故障。
        expr: increase(checkpoint_errors_total[15m]) > 0
        for: 5m
        labels:
          category: availability
          severity: warning
        annotations:
          summary: "检查点读写失败（op={{ $labels.op }}）"
          description: "近 15 分钟有 {{ $value }} 次检查点操作失败（op=get_tuple 读 / put 写 / put_writes 写中间态）。op=put* 失败意味着**这轮执行的状态没有落库**，断点续跑与人工审核都会拿到过期状态。"
          runbook: "1) `docker logs` 搜「检查点」，看是连接失败（DB_URL / PG 容器 / 连接池耗尽）还是序列化错误（state 里进了不可 msgpack 的类型）；2) 看 `checkpoint_duration_seconds` 是否同步变慢（慢 ⇒ 连接池或磁盘；不变 ⇒ 逻辑错误）；3) 检查 PG 磁盘空间与 `DiskSpaceLow`；4) 恢复后**核对**这段时间的会话能否正常续跑（`/v1/sessions` 的续传路径）。"

      - alert: OnlineHallucinationDetected
        # 线上真实流量的幻觉率（**编造标识符 / 编造引用编号**这两类可被代码证明的错误）。
        # 与上面 `CitationUnsupportedFrequent` 的分工：那条只看引用编号，
        # 这条还会看 `KEY=VALUE`、路径、常量这类标识符 —— 而且是在**采样**上算比率。
        #
        # ⚠️ 需要开 `RAG_ONLINE_QUALITY_SAMPLE`（默认 0）才有数据。没开时这两个
        #    序列**不存在**（不是 0）⇒ 本规则 inactive。这是刻意的：没开采样时
        #    "没有异常"与"没在检查"必须能分开。
        #
        # 分母用 `sum(rate(...))`：分子是无标签的单序列，不聚合会让两侧标签集
        # 不匹配，表达式的求值结果为空（**永不触发**，且没有任何报错）。
        expr: |
          rate(online_answer_hallucinated_total[30m])
          / clamp_min(sum(rate(online_answer_judged_total[30m])), 0.001) > 0.05
        for: 15m
        labels:
          category: availability
          severity: warning
        annotations:
          summary: "采样到的线上答案里出现编造（占比 > 5%）"
          description: "近 30 分钟被采样的回答中，{{ $value | humanizePercentage }} 被判定为**确凿编造**（引用了语料里不存在的标识符，或标了不存在的引用编号）。判据是纯规则的、零模型调用，所以这不是主观判断。"
          runbook: "1) 先看 `online_answer_judged_total{verdict}` 的构成 —— `unknown` 占比过高说明多数回答没有可核的标识符，此时这个比率本身参考价值有限（先确认样本量）；2) 与 `PROMPT_VERSION` / `EMBEDDING_MODEL` / 上游模型名的最近一次变更对照（换模型或改提示词后这类错误最常见）；3) 用离线入口复现：`python scripts/eval_generation.py --live`；4) 若集中在某类问题，考虑收紧 `answer_prompt` 或打开 `RAG_CITATION_CHECK_ACTION=block` 先止损（它会吞掉不可信引用）。"

      - alert: IdempotencyConflictsHigh
        # 客户端在拿**同一个 Idempotency-Key** 反复提交 —— 它认为上一次没成功。
        # 最常见的成因是"请求比客户端的超时窗口更慢"（弱网/网关掐断/上游变慢），
        # 客户端按正确逻辑重试；幂等键把它挡住了（这正是它存在的意义）。
        # 为什么值得叫醒人：**挡不住的那部分**会变成重复计费 + 重复历史 + 重复待审项，
        # 而服务端全程没有任何错误日志、错误率也完全正常 —— 只有这个指标能看见。
        expr: increase(idempotency_conflict_total[15m]) > 20
        for: 10m
        labels:
          category: availability
          severity: warning
        annotations:
          summary: "同键重试被挡下 {{ $value }} 次（15 分钟）"
          description: "客户端正在对同一个 Idempotency-Key 重复提交。reason=in_flight 占多数 ⇒ 请求比客户端的重试窗口更慢；reason=not_replayable 占多数 ⇒ 上一次已完成但响应没能缓存下来（重放上限 IDEMPOTENCY_MAX_BODY_BYTES 被撑满）。两者要看的图完全不同。"
          runbook: "1) 先按 reason 分档：sum by (reason) (increase(idempotency_conflict_total[15m]))；2) in_flight 多 ⇒ 对照 HighLatencyP95 与 llm_first_token_seconds 确认是不是上游变慢导致客户端提前重试（若确实更慢，客户端该调的是自己的超时，而不是让服务端放宽幂等）；3) not_replayable 多 ⇒ 看 idempotency_truncated_total 是否同向在涨，并据此调大 IDEMPOTENCY_MAX_BODY_BYTES；4) 顺手核对 idempotency_replay_total —— 它是被**正确吸收**的重试次数，两条曲线一起看才是全貌；5) idempotency_mismatch_total 在涨说明客户端把键用错了（同键换了载荷）—— 那是客户端 bug，不是服务端故障；6) idempotency_rejected_total 在涨说明客户端没按 IDEMPOTENCY_DOC_URL 公布的格式带键（缺头或含非法字符）。"

      - alert: RunControlErrors
        # 运行登记 / 停止请求 / 状态查询失败。它不影响"任务能不能跑"，只影响
        # "能不能被停下来" —— 而这正是最难排查的那类：用户点了停止没反应，
        # 服务端日志里一切正常（登记压根没成功，谁都没报错）。
        # 为什么值得一条告警：停止是**成本与安全的止损阀**（别继续烧 token、
        # 别继续改用户的文件），它静默失效时没有别的信号能发现。
        expr: increase(run_control_errors_total[15m]) > 0
        for: 5m
        labels:
          category: availability
          severity: warning
        annotations:
          summary: "运行控制失败（op={{ $labels.op }}）"
          description: "近 15 分钟有 {{ $value }} 次运行控制操作失败。op=begin ⇒ 这次运行**无法被停止**；op=request_stop ⇒ 停止请求没写进去（跨副本时表现为「点了没反应」）；op=stop_requested ⇒ 查不到停止状态，服务端会当「没停」继续跑；op=finish ⇒ 登记行残留，下一次 /stop 可能打到一条已经结束的运行上。顺带看 `run_stop_requested_total` 与 `run_stopped_total`：前者是「点了多少次」，后者是「真的收流了多少次」，两条曲线长期对不上说明停止没有真正生效。"
          runbook: "1) `docker logs` 搜「运行登记」「停止请求」，看是 PG 不可达、连接池耗尽，还是 agent_runs 表不存在（忘了跑 `python -m app.migrations apply`，版本 9）；2) 查表：`SELECT count(*), max(started_at) FROM agent_runs;` —— 行数远大于并发数说明 finish 一直在失败，那些残行要先手工清掉（它们是「幽灵运行」，会让 /stop 打空）；3) 单副本部署可以临时接受降级（停止只对同进程生效），但仍要修：多副本是常态。"

      - alert: SessionMessageErrors
        # "任务执行中补充"写不进会话历史。影响是**用户说的话丢了**，而且丢得
        # 很安静：接口会回 503（客户端能看见），但如果客户端把它当可忽略的
        # 增强接口、不做提示，用户就会以为 agent 已经收到了。
        # 为什么值得单独一条而不是并进 RunControlErrors：两者失败的**后果**不同 ——
        # 那条是"停不下来"，这条是"说了没听见"，处置入口完全不一样。
        expr: increase(session_message_errors_total[15m]) > 0
        for: 5m
        labels:
          category: availability
          severity: warning
        annotations:
          summary: "任务执行中补充写入失败"
          description: "近 15 分钟有 {{ $value }} 次补充消息写入会话历史失败。这类补充是**唯一持久**的那一份（进程内暂存会随重启/换副本消失），写不进去就意味着下一个节点与下一轮都看不到它。顺带看 `session_message_total`：若它同时为 0，说明这个端点根本没被调用过，问题在上游客户端而不是存储。"
          runbook: "1) `docker logs` 搜「补充写入会话历史失败」，异常类型会直接写在响应里（503 带 `type(e).__name__`）；2) 常见原因：`DB_URL` 没配（单机开发环境）、`agent_messages` 表没建（迁移版本 7）、PG 连接池耗尽；3) 确认 `session_message_total` 的增速 —— 只有高峰失败 ⇒ 容量问题，一直失败 ⇒ 配置问题；4) 恢复后提醒用户：失败那几句**没有**进历史，需要重发。"

  # =========================================================================
  # SLO 与错误预算（定义见 SLO.md，本组的表达式与那份文档一一对应）
  # =========================================================================
  # 与上面"可用性"组的区别
  # ----------------------
  #   availability 回答"**此刻**是不是坏了" —— 瞬时错误率过阈值就响。
  #   slo          回答"照这个速度烧下去，月底的错误预算还够不够" —— 靠**燃尽率**判定。
  # 两者都要有：瞬时阈值对"慢刀子"（错误率 6% 但一直 6%）几乎无感，
  # 而纯燃尽率对"刚发生的尖峰"反应太慢。
  #
  #   燃尽率（burn rate）= 实际错误率 / (1 - SLO 目标)
  #     燃尽率 = 1     ⇒ 不快不慢，刚好在窗口末用完预算
  #     燃尽率 = 14.4  ⇒ 1 小时烧掉 30 天预算的 2%（约 8.6 小时烧光，必须立刻处置）
  #
  # 为什么必须"长窗口 + 短窗口"同时成立（多窗口多燃尽率）
  # ------------------------------------------------
  # 只看长窗口：已经过去的尖峰会让告警继续挂很久（恢复慢、误报长）。
  # 只看短窗口：30 秒抖动就能把人叫醒（噪音，很快被忽略）。
  # 一个 `and` 同时要求两者 ⇒ 既证明"长期确实在烧"，也证明"此刻还在烧"。
  #
  # SLI 口径的一个易错点：**分母/分子用 `http_requests_total{status=~"5.."}`，
  # 不要用 `http_errors_total`** —— 后者只在**未捕获异常**时自增
  # （见 `app/middleware.py`），503 这类"正常返回的失败"不计入，
  # 拿它当分子会系统性低估错误率，SLO 看着永远达标。
  - name: chatagent-slo
    rules:
      # ---- 可用性 SLO：30 天 99.5%（错误预算 0.5%） ----
      - alert: SLOAvailabilityBurnFast
        # ⚠️ 分子 = 5xx **加上** `request_timeout_total`，不是只有 5xx。
        #    流式请求超时返回的是 **200 + SSE `timeout` 事件**（连接早就开始写了，
        #    改不了状态码），所以它既不是 5xx、又没有首 token 样本 ——
        #    只认 5xx 的话，「用户干等 60 秒一个字没看到」会被算成**可用**，
        #    而延迟 SLI 也不认它 ⇒ 两条 SLI 之间留了一条缝。
        #    每个请求只落进一条：产出了首 token ⇒ 进 stream_latency；没产出 ⇒ 进这里。
        #    守卫：`test_availability_counts_stream_timeouts_as_bad_events`。
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[1h]))
              + sum(rate(request_timeout_total[1h]))
          )
            / clamp_min(sum(rate(http_requests_total[1h])), 0.001)
            > 14.4 * (1 - 0.995)
          and
          (
            sum(rate(http_requests_total{status=~"5.."}[5m]))
              + sum(rate(request_timeout_total[5m]))
          )
            / clamp_min(sum(rate(http_requests_total[5m])), 0.001)
            > 14.4 * (1 - 0.995)
        for: 2m
        labels:
          category: slo
          severity: critical
          slo: availability
          kind: burn
        annotations:
          summary: "可用性错误预算高速燃尽（1h 燃尽率 > 14.4x，slo=availability）"
          description: "近 5 分钟 5xx 比例 > 7.2%（= 14.4 × 0.5% 错误预算）。按此速度 30 天预算约 8.6 小时烧光。"
          runbook: "1) 看 HighErrorRate / StreamErrorsHigh 是否同时 firing（是则同一根因，按那条处置）；2) 用 path 标签定位到具体路由；3) 在结构化日志里按 request_id 串起整条链路；4) 无法快速定位就回滚最近一次发布（release 标签可区分 stable/canary）。"

      - alert: SLOAvailabilityBurnMedium
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[6h]))
              + sum(rate(request_timeout_total[6h]))
          )
            / clamp_min(sum(rate(http_requests_total[6h])), 0.001)
            > 6 * (1 - 0.995)
          and
          (
            sum(rate(http_requests_total{status=~"5.."}[30m]))
              + sum(rate(request_timeout_total[30m]))
          )
            / clamp_min(sum(rate(http_requests_total[30m])), 0.001)
            > 6 * (1 - 0.995)
        for: 15m
        labels:
          category: slo
          severity: critical
          slo: availability
          kind: burn
        annotations:
          summary: "可用性错误预算持续燃尽（6h 燃尽率 > 6x，slo=availability）"
          description: "近 30 分钟 5xx 比例 > 3%（= 6 × 0.5%）。半天内已烧掉预算的 5%，属于持续性的稳定出错，比尖峰更容易被忽视。"
          runbook: "1) 这类告警通常对应一个**长期存在**的错误源（如某个上游偶尔超时），先看 6 小时内的错误按 path 分布是否集中在单一路由；2) 结合 llm_tokens_per_request 判断是不是模型侧退化；3) 定位后要么修，要么正式调整 SLO（改 SLO.md 与表达式，别只改一处）。"

      - alert: SLOAvailabilityBurnSlow
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[3d]))
              + sum(rate(request_timeout_total[3d]))
          )
            / clamp_min(sum(rate(http_requests_total[3d])), 0.001)
            > 1 * (1 - 0.995)
          and
          (
            sum(rate(http_requests_total{status=~"5.."}[6h]))
              + sum(rate(request_timeout_total[6h]))
          )
            / clamp_min(sum(rate(http_requests_total[6h])), 0.001)
            > 1 * (1 - 0.995)
        for: 1h
        labels:
          category: slo
          severity: warning
          slo: availability
          kind: burn
        annotations:
          summary: "可用性错误预算匀速燃尽（3d 燃尽率 > 1x，slo=availability）"
          description: "3 天内平均 5xx 比例 > 0.5%。不紧急，但若不处理，月末必然违约 —— 这条告警的作用就是提前一周发现问题。"
          runbook: "1) 排期处理，不必立刻叫人；2) 若确认是常态（如某个低价值路由天然易错），应把它从 SLI 口径里排除或正式下调 SLO，而不是让告警长期挂着；3) 复核 SLO.md 里的错误预算余额。"

      # ---- 延迟 SLO：99% 的**非流式**请求在 1 秒内完成（预算 1%） ----
      # 为什么排除 /v1/chat.*：那两个路由是 SSE 长连接，耗时等于整段生成的时长
      # （秒到几十秒），把它算进来会让延迟 SLI 恒不达标，等于没有这个指标。
      # 阈值取 `le="1.0"`：这是 `app/metrics.py` 实际渲染出的格式，
      # 写成 `le="1"` 会因为全串不匹配而**永不触发**。
      - alert: SLOLatencyBurnFast
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{path!~"/v1/chat.*",le="1.0"}[1h]))
              / clamp_min(sum(rate(http_request_duration_seconds_count{path!~"/v1/chat.*"}[1h])), 0.001)
          ) > 14.4 * (1 - 0.99)
          and
          1 - (
            sum(rate(http_request_duration_seconds_bucket{path!~"/v1/chat.*",le="1.0"}[5m]))
              / clamp_min(sum(rate(http_request_duration_seconds_count{path!~"/v1/chat.*"}[5m])), 0.001)
          ) > 14.4 * (1 - 0.99)
        for: 5m
        labels:
          category: slo
          severity: warning
          slo: latency
          kind: burn
        annotations:
          summary: "非流式接口延迟预算高速燃尽（1h 燃尽率 > 14.4x）"
          description: "近 5 分钟有 > 14.4% 的非流式请求超过 1 秒（= 14.4 × 1% 预算）。"
          runbook: "1) 按 path 标签看是哪个路由变慢（/v1/reviews 慢 ⇒ 查审核队列表与 PG；/health/* 慢 ⇒ 查依赖探针是否在等待外部服务）；2) 若同时 HighLatencyP95 firing，按那条的 runbook 走。"

      - alert: SLOLatencyBurnSlow
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{path!~"/v1/chat.*",le="1.0"}[3d]))
              / clamp_min(sum(rate(http_request_duration_seconds_count{path!~"/v1/chat.*"}[3d])), 0.001)
          ) > 1 * (1 - 0.99)
          and
          1 - (
            sum(rate(http_request_duration_seconds_bucket{path!~"/v1/chat.*",le="1.0"}[6h]))
              / clamp_min(sum(rate(http_request_duration_seconds_count{path!~"/v1/chat.*"}[6h])), 0.001)
          ) > 1 * (1 - 0.99)
        for: 1h
        labels:
          category: slo
          severity: warning
          slo: latency
          kind: burn
        annotations:
          summary: "非流式接口延迟预算匀速燃尽（3d 燃尽率 > 1x）"
          description: "3 天内平均有 > 1% 的非流式请求超过 1 秒。"
          runbook: "排期优化（典型是 PG 查询缺索引或探针串行等待）；若 1 秒的目标本身定得不合理，改 SLO.md 与表达式两处。"

      # ---- 流式延迟 SLO：95% 的流式对话请求首 token ≤ 5 秒（预算 5%） ----
      # 为什么用**首 token**而不是整段耗时：整段由回答长度主导（写三句与写三百句
      # 差两个数量级），同一个阈值对短答案永远达标、对长答案永远不达标 ——
      # 它衡量的是"回答有多长"，不是"服务有多快"。行业口径也是如此。
      #
      # `kind="chat"` 只算主对话路径，**不含** `resume`（恢复生成 —— 用户预期本就
      # 不同，他已经等过一轮）与 `review`（内部审核后台）。一个 SLI 必须对应一个
      # 明确的用户旅程；把三种预期混进同一个分位数，得到的是不对应任何人的数。
      #
      # `mode="stream"` 排除 buffered 那一档：agent 链路整段返回，它的"首字节"
      # 其实是整段生成耗时，与流式差一个数量级。
      #
      # `le="5.0"` 必须落在直方图桶边界上（现有边界 … 2.5 / 5.0 / 10.0 …）。
      # 写成 `le="3.0"` 不会报错，只是**匹配不到任何桶** ⇒ 好事件恒为 0 ⇒
      # 预算一上线就烧光，而告警照常"在工作"。
      # 守卫：`test_sli_thresholds_land_on_histogram_bucket_boundaries`。
      #
      # 超时的流式请求**刻意不在这里补**：它们没有首 token 样本，已计入
      # availability 的坏事件（见 SLOAvailabilityBurnFast 的注释）。
      # 每个请求只进一条 SLI，同一件事不罚两次。
      - alert: SLOStreamLatencyBurnFast
        expr: |
          (
            sum(rate(llm_first_token_seconds_count{kind="chat",mode="stream"}[1h]))
              - sum(rate(llm_first_token_seconds_bucket{kind="chat",mode="stream",le="5.0"}[1h]))
          )
            / clamp_min(sum(rate(llm_first_token_seconds_count{kind="chat",mode="stream"}[1h])), 0.001)
            > 14.4 * (1 - 0.95)
          and
          (
            sum(rate(llm_first_token_seconds_count{kind="chat",mode="stream"}[5m]))
              - sum(rate(llm_first_token_seconds_bucket{kind="chat",mode="stream",le="5.0"}[5m]))
          )
            / clamp_min(sum(rate(llm_first_token_seconds_count{kind="chat",mode="stream"}[5m])), 0.001)
            > 14.4 * (1 - 0.95)
        for: 2m
        labels:
          category: slo
          severity: warning
          slo: stream_latency
          kind: burn
        annotations:
          summary: "流式首 token 延迟预算高速燃尽（1h 燃尽率 > 14.4x，slo=stream_latency）"
          description: "近 5 分钟有 > 72% 的流式对话请求首 token 超过 5 秒（= 14.4 × 5% 错误预算）。注意这是**首 token**，不是整段生成 —— 整段慢由回答长度主导，看它说明不了用户等了多久才看见第一个字。"
          runbook: "1) 先分诊首 token 之前的每一段：`rag_stage_duration_seconds`（检索）、`agent_history_compaction_seconds{result=\"error\"}`（压缩超时白等一次）、`llm_call_duration_seconds`（模型调用本身）；2) 三者都正常 ⇒ 是**排队**：看 `http_concurrency_in_flight / http_concurrency_limit`、`rate_limited_total` 与上游 429 的重试；3) 同时看 `FirstTokenTooSlow` —— 它（P95 > 8s）通常紧跟在这条之后 firing，那是同一根因的更粗粒度信号；4) 上游整体抖动时优先保护体验（降级到更短的历史、关掉非必要工具），不要调大超时把等待藏起来。"

      - alert: SLOStreamLatencyBurnSlow
        expr: |
          (
            sum(rate(llm_first_token_seconds_count{kind="chat",mode="stream"}[3d]))
              - sum(rate(llm_first_token_seconds_bucket{kind="chat",mode="stream",le="5.0"}[3d]))
          )
            / clamp_min(sum(rate(llm_first_token_seconds_count{kind="chat",mode="stream"}[3d])), 0.001)
            > 1 * (1 - 0.95)
          and
          (
            sum(rate(llm_first_token_seconds_count{kind="chat",mode="stream"}[6h]))
              - sum(rate(llm_first_token_seconds_bucket{kind="chat",mode="stream",le="5.0"}[6h]))
          )
            / clamp_min(sum(rate(llm_first_token_seconds_count{kind="chat",mode="stream"}[6h])), 0.001)
            > 1 * (1 - 0.95)
        for: 1h
        labels:
          category: slo
          severity: warning
          slo: stream_latency
          kind: burn
        annotations:
          summary: "流式首 token 延迟预算匀速燃尽（3d 燃尽率 > 1x，slo=stream_latency）"
          description: "3 天内平均有 > 5% 的流式对话请求首 token 超过 5 秒。不紧急，但按此速度月末必然违约 —— 这条的作用是提前一周发现。"
          runbook: "1) 排期处理，不必立刻叫人；2) 先按 `kind` 与时间分布看是不是集中在特定请求类型（长历史会话更容易慢：压缩 + 检索都随历史增长）；3) 若确认是**本服务的链路**变慢（检索/压缩占比上升），优化那一段；若确认是**上游模型**整体变慢，那是供应商问题 —— 要么换模型/加缓存，要么按 SLO.md §7 正式调整阈值，别让告警长期挂着。"

      # ---- 预算**余量**：与上面 7 条是两种问法，别当成同一族 ----
      # 上面 5 条读的是 `rate`（速率）：回答"按这个速度还要多久烧光"，
      # 所以能在烧掉 2% 时就叫人 —— 但到窗口末尾它对"还剩多少"完全无感。
      # 下面 2 条读的是 `slo:budget_remaining_ratio`（录音规则，见 recording.yml）：
      # 回答"现在还剩多少"，覆盖 `ERROR_BUDGET_POLICY.md` 政策表里那两行
      # "预算剩余 < 20% ⇒ 冻结" / "预算耗尽 ⇒ 全面冻结 + 48h 复盘"。
      #
      # ⚠️ 两条表达式都是**光秃秃的指标名**，不带窗口 —— 30 天窗口在录音规则里，
      #    不在这里。把它改回内联的 `increase(http_requests_total[30d])` 会让
      #    每次评估都要把几百条原始序列 × 86400 个点读进内存（见 recording.yml 的说明）。
      #    守卫：`test_budget_alerts_read_the_recorded_series`。
      #
      # ⚠️ 只写一条表达式就覆盖了两种 SLI：录音规则用**同一个指标名 + `slo` 标签**
      #    分别产出 availability 与 latency 两条序列（政策表写的就是"任一 SLI"）。
      #    摘要里用 `{{ $labels.slo }}` 点名 —— 与 `RateLimitSurging` 用
      #    `{{ $labels.scope }}` 是同一手法。守卫：`test_budget_remaining_is_recorded_for_every_sli`。
      - alert: SLOBudgetLow
        expr: slo:budget_remaining_ratio < 0.2
        # 30m：余量是慢变量，抖动只来自录音窗口的滑动，不需要更快。但也不能太慢 ——
        # 政策要求"剩余 < 20% 就冻结该 SLI 的功能变更"，晚一天发现就多一天带病发布。
        for: 30m
        labels:
          category: slo
          severity: warning
          kind: budget
        annotations:
          summary: "{{ $labels.slo }} 的 30 天错误预算剩余不足 20%（当前 {{ $value | humanizePercentage }}）"
          description: "按 `ERROR_BUDGET_POLICY.md`：该 SLI 相关路由的功能变更**冻结**，直到预算回到 50% 以上；只允许修 bug、加监控、调限流阈值、回滚。"
          runbook: "1) 先确认不是误判：`slo:budget_remaining_ratio` 是**近似值**（录音规则对 rate 取平均，Prometheus 重启后的插值会被平均进去），对照 `rate(...[3d])` 的燃尽率看趋势是否一致；2) 若是真的：执行冻结（该 SLI 相关路由只走修复类变更），并把'下一步解冻条件 = 回到 50%'写进发布记录；3) 若确认剩余量长期低位是因为 SLO 定得过松/过紧，走 SLO.md §7 的正式调整流程，别只改表达式。"

      - alert: SLOBudgetExhausted
        expr: slo:budget_remaining_ratio <= 0
        # 15m：比上一条短 —— 它对应的是政策里最重的一档动作（全面冻结 + 48h 复盘）。
        for: 15m
        labels:
          category: slo
          severity: critical
          kind: budget
        annotations:
          summary: "{{ $labels.slo }} 的 30 天错误预算已耗尽（当前 {{ $value | humanizePercentage }}）"
          description: "按 `ERROR_BUDGET_POLICY.md`：**全面冻结**功能变更（只做恢复与加固），并在 48 小时内产出复盘。⚠️ 这里的 critical 指\"必须当天有人做出冻结决定\"，不是\"服务正在坏\"（服务可能已经完全恢复，只是账已经花光了）。"
          runbook: "1) 执行全面冻结，把冻结范围与批准人写进发布记录；2) 48 小时内产出复盘：根因、影响范围（多少请求 / 多少租户）、**为什么现有告警没更早发现**、加固项 —— 加固项必须落到 alerts.yml / tests/ / RUNBOOK.md 里（见 ERROR_BUDGET_POLICY.md §6）；3) 复核是不是 SLI 口径本身错了（例如把流式接口算进延迟 SLI），是则走 SLO.md §7 的正式调整；4) 这条会以 24h 的节奏重复提醒（专属路由），不要在确认前静音。"

  # =========================================================================
  # 成本与配额
  # =========================================================================
  - name: chatagent-cost
    rules:
      - alert: RateLimitSurging
        expr: rate(rate_limited_total[5m]) > 1
        for: 10m
        labels:
          category: cost
          severity: warning
        annotations:
          summary: "限流频繁触发（scope={{ $labels.scope }}）"
          description: "持续 10 分钟每秒有 >1 次限流。要么有客户端在刷，要么阈值配得太紧伤了正常用户。"
          runbook: "看 scope：ip ⇒ 单来源刷量；session ⇒ 某会话多开或循环重试。确认是攻击则保持限流，是误伤则调 RATE_LIMIT_*。"

      - alert: QuotaExhausted
        expr: increase(quota_exceeded_total[1h]) > 5
        for: 5m
        labels:
          category: cost
          severity: warning
        annotations:
          summary: "多个租户触发日配额上限"
          description: "1 小时内 {{ $value }} 次配额拒绝。可能是业务增长（该加额度），也可能是被刷 —— 看涉及几个租户、集中在谁身上：租户少而量集中像业务增长；租户多而零散则怀疑令牌共享或脚本通行证泄漏。"
          runbook: "查日志 '配额拒绝：tenant=xxx'，看是几个租户、集中在谁身上。"

      - alert: AbnormalTokenBurn
        expr: |
          sum(rate(llm_tokens_total[15m])) > 100
        for: 15m
        labels:
          category: cost
          severity: warning
        annotations:
          summary: "Token 消耗速率异常（>100 token/s 持续 15 分钟）"
          description: "当前消耗速率 {{ $value | humanize }} token/秒，持续 15 分钟，请核对是否符合预期。"
          runbook: "结合 llm_budget_exceeded_total 判断是'单请求失控'（预算该收紧）还是'请求量涨了'（正常）。"

      - alert: BudgetExceededFrequent
        expr: increase(llm_budget_exceeded_total[30m]) > 10
        for: 5m
        labels:
          category: cost
          severity: warning
        annotations:
          summary: "单请求 token 预算频繁被顶到"
          description: "说明 LLM_MAX_TOKENS_PER_REQUEST 配得偏紧，回答常被截断（用户体验受损）。"
          runbook: "看 llm_tokens_per_request 的分布，把预算调到覆盖 P95。"

      - alert: ReviewBacklog
        # 这是 Gauge（抓取时刷新），不是计数器 —— 它表达"现在还压着多少"
        #
        # ⚠️ 必须 `max(...)`，不能裸用、更不能 `sum(...)`
        # ---------------------------------------------
        # `review_pending` 衡量的是**全局唯一**的量：PG 里一行待审就是一行。
        # 但每个副本都会各自查一次全量、各自报一份**完全相同的**真值 ⇒
        #   * 裸用 `review_pending > 20` ⇒ N 个副本各触发一条告警（同一条积压报 N 次）；
        #   * `sum(review_pending) > 20` ⇒ 把同一份测量相加，积压数凭空放大 N 倍，
        #     阈值 20 于是在 7 条时就响（**误报**，且看起来像"队列真的炸了"）。
        # 取一份（`max`）才是这个量的正确读法；用 `max` 而非 `avg` 是因为积压是
        # "工单丢了"的故障，宁可取到抓取窗口内的瞬时峰值稍早报。
        # ⚠️ 单副本下 `max` / `sum` / 裸用三者结果**完全相同** ⇒ 这个错误只在
        # 多副本时显形，且没有任何本地测试能发现（见 SLO.md §8 的三分类判据）。
        expr: max(review_pending) > 20
        for: 30m
        labels:
          category: cost
          severity: warning
        annotations:
          summary: "人工审核队列积压 {{ $value }} 条"
          description: "待审内容超过 20 条且持续 30 分钟没人处理 —— 对业务来说等于工单积压。"
          runbook: "1) GET /v1/reviews 看具体内容；2) 检查 REVIEW_NOTIFY_WEBHOOK 是否失效（通知没到人手里就会一直积压）。"

      - alert: ReviewWaitTooLong
        # `review_pending`（还有多少条）与这条（**等了多久**）是两个独立的问题：
        # 积压 20 条各等 10 分钟，与积压 2 条各等 3 天，前者在 `review_pending` 上
        # 完全一样。而 human-in-the-loop 服务里，用户实际承受的延迟主体就是这段等待
        # （生成只占一小段）—— 所以"等太久"必须有自己的信号。
        #
        # 分母/样本说明：观测点写在 `review_queue.resolve()`（唯一知道 `created_at`
        # 的地方），因此**只有被处理过的记录**才有样本 —— 长期没人处理的那些
        # 恰好看不到，由上面的 `ReviewBacklog` 兜住。两者互为补充，不能只留一条。
        expr: |
          histogram_quantile(0.9,
            sum(rate(review_wait_seconds_bucket[6h])) by (le)
          ) > 28800
        for: 15m
        labels:
          category: cost
          severity: warning
        annotations:
          summary: "人工审核等待时长 P90 超过 8 小时（action={{ $labels.action }}）"
          description: "近 6 小时被处理掉的待审记录里，P90 的等待时长 = {{ $value }}s。用户在拿到回答前等了这么久；而模型生成通常只占其中几秒。"
          runbook: "1) 对照 `review_pending` 判断是「处理得慢」还是「根本没人处理」（后者看 `REVIEW_NOTIFY_WEBHOOK` 是否失效）；2) 看 `action=revised` 与 `accepted` 的分布差异 —— 被打回的那些若明显更久，说明来回沟通成本高，应考虑在 `need_review` 载荷里一次给全判据；3) 若业务上确实不需要人工把关，考虑调低触发评审的阈值而不是让人一直等。"

      - alert: FrequentClientDisconnects
        expr: rate(client_disconnected_total[10m]) > 0.5
        for: 10m
        labels:
          category: cost
          severity: warning
        annotations:
          summary: "客户端频繁中途断开"
          description: "每秒 >0.5 次断连。服务侧已及时止损（不再计费），但用户没拿到回答 —— 通常是首字节太慢或前端超时设置过短。"
          runbook: "看 HighLatencyP95 与检索耗时；检查前端 fetch 的超时配置。"

  # =========================================================================
  # 安全：这些指标平时恒为 0，一旦非 0 就是有人在试探
  # =========================================================================
  - name: chatagent-security
    rules:
      - alert: TenantMismatchDetected
        # 单条即告警：正常客户端不会拿着 A 的 Key 自称 B。
        expr: increase(tenant_mismatch_total[15m]) > 0
        labels:
          category: security
          severity: critical
        annotations:
          summary: "检测到租户冒用尝试（{{ $value }} 次）"
          description: "有客户端带着某个租户的令牌，却声明了另一个租户的 X-Tenant-Id。已按 403 拒绝，但这说明有人在探测越权。"
          runbook: "1) 查日志 '租户自报与用户凭证不符' 定位来源 IP 与 sub；2) 来自内部 ⇒ 调用方把别的租户 id 写进了 X-Tenant-Id；来自外部 ⇒ 有人用自己租户的令牌试探别的租户，按越权处置（必要时停用该账号）。注意：本指标只有一个来源 —— 令牌与请求头不符；租户**不可能**被请求头改掉（取值只认令牌载荷）。"

      - alert: SessionOwnershipViolation
        expr: increase(session_owner_mismatch_total[15m]) > 0
        labels:
          category: security
          severity: critical
        annotations:
          summary: "检测到跨租户读取会话的尝试"
          description: "有请求试图用别的租户的 thread_id 续跑会话（典型是猜/撞 id）。已按 403 拒绝。"
          runbook: "查日志 '会话归属不符'，确认 thread_id 是否可枚举（若是自增/时间戳，应改为带随机段的 id）。"

      - alert: ClientDisconnectsSurging
        expr: rate(client_disconnected_total[5m]) > 5
        for: 5m
        labels:
          category: security
          severity: warning
        annotations:
          summary: "断连速率异常偏高"
          description: "每秒 >5 次断连。可能是有人在用'连上就断'的方式探测接口（也是一种低成本 DoS 尝试）。"
          runbook: "结合 rate_limited_total{scope='ip'} 看是否同源；必要时收紧 nginx 层 limit_req。"

  # =========================================================================
  # 平台自身（监控栈 + 备份）—— 这一类回答的是"**谁来发现监控坏了**"
  # =========================================================================
  # 为什么必须有这一组
  # ----------------
  # 上面四组监控的都是**业务**（服务活没活、错误率高不高、有没有人在攻击）。
  # 缺了这一组时会出现一种最糟糕的状态：**整个告警链路安静地失效，而你以为一切正常**。
  # 具体是这几条路径：
  #   - Alertmanager 挂掉 ⇒ 21 条规则照样 firing（面板上灯全亮），但一条都送不出去；
  #   - alert-sink 的通道没配 / 全部失败 ⇒ Alertmanager 记 `notifications_failed_total`，
  #     而**没有任何规则在看这个指标**；
  #   - blackbox-exporter 挂掉 ⇒ `probe_success` 停止产出（不是变成 0），
  #     ExternalProbeFailing 因此**不触发** —— 外部探活静默死亡；
  #   - 备份循环失败 ⇒ 没有人知道，只能靠人记得去 `ls -lt backups/`；
  #   - 日志撑满磁盘 ⇒ PG 写不进去 ⇒ 随机 500，而**磁盘本身没有告警**。
  #
  # ⚠️ 一个必须讲明的**固有局限**（别指望这一组能覆盖它）
  # --------------------------------------------------
  # `MonitoringStackDown` 这条规则**由 Prometheus 自己求值**，所以：
  #   - **Prometheus 自己挂了** ⇒ 没有东西在求值 ⇒ 这条规则不会响。这是自我指涉的死角，
  #     单实例 Prometheus 无法靠自身解决，只能用"外部探活"或"心跳缺失"来发现；
  #   - **Alertmanager 挂了** ⇒ 这条规则会 firing，但它**要经过 Alertmanager 才能送达**
  #     ⇒ 同样送不出来。
  # 真正能穿透这两层死角的是 `Watchdog`（下面第一条）：它**永远处于 firing**，
  # 靠的是"**该来的心跳没来**"这个**缺失**信号，而不是"某条规则响了"。所以：
  #   → 约定：值班的人**每 24 小时应该收到一次 Watchdog 心跳**。收不到，就是链路断了，
  #     此时任何告警（包括"链路断了"这一条）都不可信。
  - name: chatagent-platform
    rules:
      - alert: Watchdog
        # 恒真表达式 ⇒ 永远处于 firing。它的价值**不在"响"，而在"持续到达"**。
        # 这是监控系统唯一能自证"我还活着"的手段：因为它是**必须到达**的，
        # 所以"没到达"本身就是一个可观测信号。
        # 没有它时，"今天没收到告警"永远分不清是 ① 真没故障，还是 ② 链路早断了。
        expr: vector(1)
        labels:
          category: platform
          severity: none
        annotations:
          summary: "心跳（这条告警永远 firing，用来证明告警链路本身是活的）"
          description: "它**必须一直在 firing**，且按 repeat_interval 定期到达值班通道。若某一天没有收到它，说明采集/判定/路由/送达的某一环断了 —— 此时其它告警是否响起都不可信（因为那些告警走的是同一条链路）。"
          runbook: "收到它 ⇒ 什么都不用做。**没收到** ⇒ 按 `deploy/RUNBOOK.md` §3.5 的『心跳缺失』逐环排查：① `localhost:9090/targets` 看 chatagent-* 是否 UP；② `localhost:9090/alerts` 看 Watchdog 是否 firing；③ `localhost:9090/status` 看 Alertmanager 是否 UP；④ `docker logs alertmanager` 与 `docker logs alert-sink` 看投递是否失败；⑤ 检查 alert-sink 的通道是否配置（`--selftest`）。"

      - alert: MonitoringStackDown
        # 只列**由 Prometheus 直接抓取**的目标。刻意不写 `job="prometheus"` 的自我保护语义
        # —— 它确实列在这里，但要知道 Prometheus 自己挂了就没有求值者（见本组顶部说明）。
        expr: up{job=~"prometheus|alertmanager|node-exporter|blackbox-exporter"} == 0
        for: 5m
        labels:
          category: platform
          severity: critical
        annotations:
          summary: "监控栈组件不可达（{{ $labels.job }} @ {{ $labels.instance }}）"
          description: "**这一条本身可能送不出去**（Alertmanager 挂了时）。它的首要用途是 `up` 面板与告警历史里的留痕，以及配合 Watchdog 的心跳缺失来定位断在哪一环。"
          runbook: "1) 按 job 定位：alertmanager ⇒ 告警从此发不出（先恢复它，再补发）；blackbox-exporter ⇒ ExternalProbeFailing 也**不会触发**（`probe_success` 停止产出而不是变 0，这是最隐蔽的一种失效）；node-exporter ⇒ 磁盘告警静默失效；2) `docker compose --env-file .env -f deploy/app/docker-compose.yml ps` + `logs` 看是崩了还是资源被限；3) 恢复后**核对这段时间的业务是否真的有故障** —— 监控盲区里的故障只能从用户侧或日志里补回来。"

      - alert: TLSCertProbeDown
        # 为什么必须单独有这一条（2026-10-06 补）
        # ------------------------------------------------
        # `TLSCertExpiringSoon` 读的是 blackbox 给出的 `probe_ssl_earliest_cert_expiry`，
        # 而**这个序列只在探活成功时才产出**。探活本身坏了 ⇒ 表达式匹配到空序列 ⇒
        # 证书告警**永远 inactive 且没有任何报错** —— 又一次"用缺失表达故障"。
        # 而 `MonitoringStackDown` 的 `up{}` 里是**逐个列举** job 名的
        # （prometheus|alertmanager|node-exporter|blackbox-exporter），
        # 新增的探活 job 不在列举里，于是从判据下面穿了过去 ——
        # 这个仓库今天已经因为"列举式判据"栽过两次，所以除了这条规则，
        # `tests/test_monitoring_config.py` 里还加了"每个 scrape job 都必须有人盯"的守卫。
        #
        # 两种触发原因的处置完全不同，必须由人区分（所以 runbook 从"先看报错"开始）：
        #   ① 域名还是 `REPLACE-WITH-YOUR-DOMAIN` 占位符（配置步骤没做完）；
        #   ② 域名填了，但 https_2xx 探活失败（证书/入口/网络问题）。
        expr: up{job="blackbox-tls"} == 0
        for: 30m
        labels:
          category: platform
          severity: warning
        annotations:
          summary: "TLS 证书探活没有在工作（blackbox-tls 抓取失败）"
          description: "blackbox-tls 取不到数据 ⇒ `probe_ssl_earliest_cert_expiry` 一条序列都没有 ⇒ `TLSCertExpiringSoon` 变成**哑弹**。持续下去，证书到期那天全站会被浏览器直接拦下，而监控里一切正常。"
          runbook: "1) 先看 `localhost:9090/targets` 里 blackbox-tls 那行的报错：DNS 解析失败 ⇒ 多半是域名还是占位符（见 `deploy/monitoring/prometheus.yml` 里这个 job 的注释，替换后 restart prometheus）；2) 确认 `blackbox-exporter` 容器活着（`docker compose --env-file .env -f deploy/app/docker-compose.yml ps`）—— 它挂了时 `MonitoringStackDown` 也会一起响；3) 若你的 HTTPS 入口不在本编排内（TLS 由外部 LB 终结），正确做法是**删掉 blackbox-tls 这个 job 与这条规则**，而不是留一条常年 firing 的告警（常年 firing 等于没有告警）；4) 修好后用 `curl -s --noproxy '*' localhost:9090/api/v1/targets | python -m json.tool | grep -A3 blackbox-tls` 复核其为 UP。"

      - alert: AlertDeliveryFailing
        # Alertmanager 自己暴露的投递失败计数。它回答的问题是
        # "**告警在响，但发不出去**" —— 这正是本项目当前（通道未配）所处的状态，
        # 也是所有监控里最需要一个探测器的地方。
        #
        # ⚠️ 它同样受"自我指涉"限制：这条告警也要经过 Alertmanager 才能送达。
        #    它真正有效的场景是**部分失败**（某个 receiver 坏了、另一个还能用），
        #    以及事后诊断与面板留痕。全链路失败只能靠 Watchdog 缺失发现。
        expr: rate(alertmanager_notifications_failed_total[10m]) > 0
        for: 10m
        labels:
          category: platform
          severity: critical
        annotations:
          summary: "Alertmanager 投递失败（integration={{ $labels.integration }}）"
          description: "近 10 分钟持续有通知投递失败。最常见的两种成因：① alert-sink 的通道**未配置**（按设计只记日志、接口仍回 200，所以只是静默丢消息）；② 通道配了但机器人 URL 失效 / 被对方限频。"
          runbook: "1) `docker compose --env-file .env -f deploy/app/docker-compose.yml logs --tail=200 alert-sink | grep -i '未配置\\|失败'`；2) 若日志说『未配置通道』⇒ 去 `.env` 填 `ALERT_SINK_*_WEBHOOK`（见 `PRODUCTION_CONFIG.md` §一）；3) 若日志说投递失败 ⇒ 用 `python alert_sink.py --selftest` 复现并看对方返回体；4) 在 `http://localhost:9093/#/status` 的 failed notifications 里看原始错误。"

      - alert: BackupLoopFailing
        # 数据来源：backup-pg / backup-qdrant 循环每轮把"上次成功时间"写进
        # `<backups>/backup-<target>.prom`（node-exporter 的 textfile collector 读走）。
        # 为什么不用"容器在跑"来判断：见 RUNBOOK §4.1 —— **容器在运行不等于备份在发生**。
        # 阈值 54000s = 15h：默认间隔 6h，给两个周期 + 3 小时余量；
        # 改 `BACKUP_INTERVAL_HOURS` 时要同步改这里（否则会稳定误报/漏报）。
        #
        # ⚠️ `and on(target) (backup_backend_skipped != 1)` 这一句不是装饰：
        #    Qdrant 未启用时那个循环会**永远** rc=2（明确播报"跳过"），
        #    若只看时间戳就会得到一个**永不恢复的假告警** —— 而长期存在
        #    的假告警等于没有告警（所有人都会忽略它）。
        expr: |
          (time() - backup_last_success_timestamp_seconds > 54000)
          and on(target)
          (backup_backend_skipped != 1)
        for: 30m
        labels:
          category: platform
          severity: warning
        annotations:
          summary: "备份已超过 15 小时没有成功过（target={{ $labels.target }}）"
          description: "`backup_last_success_timestamp_seconds` 太久没更新，且最近一轮并非\"后端未启用\"（否则会被 `backup_backend_skipped` 排除）。持续下去等于**没有备份**，而这只有在真要恢复时才会被发现。"
          runbook: "1) `docker compose --env-file .env -f deploy/app/docker-compose.yml logs --tail=100 backup-pg backup-qdrant` 看失败原因（PG 连不上 / Qdrant 报错 / 磁盘满）；2) `ls -lt backups/ | head` 看最后一次成功文件的时间；3) 修好根因后让**循环**重跑一轮以推进指标：`docker compose --env-file .env -f deploy/app/docker-compose.yml restart backup-pg`（循环是『启动即跑一轮』）—— ⚠️ 单跑 `python scripts/pg_backup.py backup` 只落一个 dump 文件、**不会**刷新这个指标（.prom 由循环写），只做它告警不会停；4) 恢复后**必须**跑一次 `python scripts/pg_backup.py drill` —— 没恢复过的备份不算备份。"

      - alert: BackupMetricsMissing
        # 与上一条的分工：上一条管"指标说很久没成功"，这一条管"**指标本身不见了**"。
        # 后者的成因是链路断在更前面：备份容器没起 / textfile 目录没挂对 /
        # node-exporter 的 `--collector.textfile.directory` 写错。
        # 为什么必须单独一条：`absent()` 与"数值超标"是两种完全不同的故障，
        # 塞进同一条表达式会让人分不清该去查备份还是查 exporter。
        expr: absent(backup_last_success_timestamp_seconds)
        for: 30m
        labels:
          category: platform
          severity: warning
        annotations:
          summary: "备份指标完全不存在（textfile 链路断了）"
          description: "Prometheus 里找不到任何 `backup_last_success_timestamp_seconds` 序列。也就是说：**备份是否在跑，已经完全不可观测**。此时 BackupLoopFailing 也一定不会触发（它依赖同一个指标）。"
          runbook: "1) `docker compose --env-file .env -f deploy/app/docker-compose.yml ps` 看 backup-pg / backup-qdrant / node-exporter 是否都在运行；2) `ls -la backups/*.prom` 看循环有没有写出指标文件（没有 ⇒ 循环没走到写文件那步，看它的日志）；3) `curl -s localhost:9100/metrics | grep backup_` 看 node-exporter 有没有读到（读不到 ⇒ textfile 目录挂载或参数不对）；4) 三处依次修，别跳过第 3 步 —— 它是唯一能区分『没写』与『没读到』的检查。"

      - alert: PgTableGrowthFast
        # DiskSpaceLow 的**提前量**。那条响的时候余量往往只剩几小时，而且它只说
        # "盘要满了"、不说"是谁在吃" —— 而在这个库里，某张表涨得快，与
        # 备份窗口变长、VACUUM 跟不上，是同一条因果链上的前后段。
        #
        # ⚠️ 为什么这条现在特别需要：2026-10-03 起对话历史改为**永久保留**
        #   （RETENTION_DAYS=0，清理任务整体停用）⇒ agent_messages / agent_sessions /
        #   检查点三张表 / review_queue / session_owners 全部只增不减。那是**有意为之**
        #   的设计，而它唯一必须配套的东西就是"看得见它在涨"。
        #
        # 数据来源与备份指标同一条链路：pg-stats 容器每 15 分钟写
        # backups/pg-tables.prom，node-exporter 的 textfile collector 抓走。
        #
        # 阈值（6 小时 1.5GB ≈ 6GB/天）刻意偏宽松：正常业务的对话历史到不了这个量级，
        # 到了就说明被刷、或某类内容在异常膨胀。**按盘容量与业务量调整**，
        # 调小是有意义的（越早看见越有余地），但别关掉它 —— 它是磁盘告警唯一的提前量。
        expr: delta(pg_table_size_bytes[6h]) > 1.5e9
        for: 15m
        labels:
          category: platform
          severity: warning
        annotations:
          summary: "PG 表 6 小时内增长超过 1.5GB（table={{ $labels.table }}）"
          description: "{{ $labels.table }} 在 6 小时内增长了 {{ $value }} 字节。历史数据是**永久保留**的（刻意如此），所以增长本身不是故障 —— 要判断的是**跑得快的那一张**是不是在异常膨胀。"
          runbook: "1) 先确认采集链路还活着：`curl -s localhost:9100/metrics | grep pg_table_size_bytes`；为空 ⇒ 修 pg-stats 容器（`docker compose --env-file .env -f deploy/app/docker-compose.yml logs pg-stats`），否则这条告警本身就是哑的；2) `docker compose exec pgvector psql -U langgraph_app -d langgraph_checkpoints -c \"SELECT relname, pg_size_pretty(pg_total_relation_size(oid)) FROM pg_class WHERE relkind='r' ORDER BY pg_total_relation_size(oid) DESC LIMIT 10\"` 看排名；3) agent_messages 涨得快 ⇒ 对照 http_requests_total 看是否被刷；checkpoints 涨得快 ⇒ 长会话变多，属预期；4) 确认是预期增长就调大阈值，**不要**关掉这条规则。"

      - alert: DiskSpaceLow
        # 为什么这条必须有：compose 里每个容器的 json-file 日志默认**无上限**，
        # 加上 Prometheus TSDB、Loki 块、backups/ 一起长。合起来是一条完整的宕机路径：
        #   日志撑满盘 → PG 写不进去 → 表现成随机 500 → 而**没有任何告警**。
        # 因此它和监督日志轮转是一对，只做一半仍然漏。
        #
        # 用 `min by (instance)` + fstype 过滤而不是写死 mountpoint：
        # 不同发行版/容器里根挂载点的标签写法不一致，写死会得到"规则永不匹配"。
        expr: |
          min by (instance) (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|autofs"}
            /
            node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|autofs"}
          ) < 0.15
        for: 15m
        labels:
          category: platform
          severity: critical
        annotations:
          summary: "磁盘可用空间低于 15%（{{ $labels.instance }}）"
          description: "当前最小可用比例 {{ $value | humanizePercentage }}。低于临界后 PG 会先变成只读、随后写失败，表现是**随机 500** 与检查点丢失，而原因看不出来。"
          runbook: "1) `df -h` 定位是哪个挂载点；2) 最常见的是容器日志（`docker system df -v` 看 LOGS 一列）—— 确认各服务的 `logging` 轮转生效；3) 其次是 `promdata`（Prometheus TSDB 保留期）与 `backups/`（`BACKUP_KEEP` 没生效）；4) 清理后**核对告警是否自动恢复**（`send_resolved`），并回头看这段时间是否有被掩盖的写入失败。"

      - alert: BackupDrillMissing
        # `drill`（备份 → 恢复到临时库 → 逐表比对）是**唯一能证明备份可用**的操作，
        # 而它此前没有任何东西在跑：RUNBOOK 写着"每季度做一次"，靠人记着 = 一定会被跳过。
        # 这条告警把"从没演练过"变成一件会响的事实 —— 所以**首次部署后它就会响**，
        # 这是刻意的：你确实还没验证过备份能不能恢复。跑一次 drill 它就会静默。
        #
        # 为什么不做成"定时自动演练"：`pg_backup.py drill` 要调 pg_dump / pg_restore，
        # 执行通道是「docker exec 进 PG 容器」或「宿主机 PATH 里的客户端」——
        # **容器里两条都不成立**。做一个跑不通的定时容器，比让人跑一次更糟。
        expr: absent(backup_drill_last_success_timestamp_seconds)
        for: 1h
        labels:
          category: platform
          severity: warning
        annotations:
          summary: "从未成功执行过一次恢复演练"
          description: "Prometheus 里没有任何 `backup_drill_last_success_timestamp_seconds` 序列。**没被恢复过的备份不算备份** —— 备份文件可能在，但恢复链（pg_restore 权限、版本匹配、临时库创建）从未被验证过。"
          runbook: "在仓库根执行 `python scripts/pg_backup.py drill`（备份→恢复到临时库→逐表比对→清理），再跑 `python scripts/qdrant_backup.py drill` 校验向量库快照。两者都会把结果写进 `backups/drill-*.prom`，本告警随之解除。"

      - alert: BackupDrillOverdue
        # 与 Missing 的分工：Missing 管"从来没有过"，这一条管"有过、但太旧"。
        # 100 天 ≈ 一个季度再留余量；按 RUNBOOK 的季度要求，超过它说明至少漏了一整个季度。
        #
        # ⚠️ 不要写成 `for: 24h` 之类的长窗口：`for` 只影响"进入告警"的延迟，
        #    它不会让"已经过期 100 天"这件事更可信。
        expr: time() - backup_drill_last_success_timestamp_seconds > 100 * 86400
        for: 1h
        labels:
          category: platform
          severity: warning
        annotations:
          summary: "恢复演练已超过 100 天没有成功过（target={{ $labels.target }}）"
          description: "上次成功演练距今 {{ $value | humanizeDuration }}。备份在持续产生，但**没有人验证过它还能被恢复**；而语料、PG 版本、权限都可能在这段时间里变了。"
          runbook: "跑一次 `python scripts/pg_backup.py drill`。若它失败，先按失败原因修 —— 这是最有价值的信号：说明**你现在手上的备份可能真的恢复不了**。修好后重跑，确认 `backups/drill-pg.prom` 里的时间戳已更新。"

      - alert: BackupDrillFailed
        # 演练**跑了但没过**。这条比 Missing / Overdue 更急：它说明"备份此刻恢复不了"，
        # 而且我们已经知道了 —— 此时什么都不做，等于明知故犯地继续裸奔。
        expr: backup_drill_result == 0
        for: 5m
        labels:
          category: platform
          severity: warning
        annotations:
          summary: "上一次恢复演练**未通过**（target={{ $labels.target }}）"
          description: "`backup_drill_result{target=...} == 0`：演练执行了但结果不通过（行数不一致、表缺失、快照结构损坏）。这意味着**当前的备份很可能恢复不出可用的库**。"
          runbook: "1) 看演练输出里的 `✗` 标记，确定是哪些表缺失或行数不一致；2) 常见成因：备份时用了 `--schema-only`、目标库 PG 版本与源不一致、备份文件被截断（`verify` 能查出来）；3) 修好后重跑 drill，确认 `backup_drill_result` 变回 1。"

  # =========================================================================
  # agent 能力链路（所有请求都走它；文学 / PPT / 插图是它内部会叫的帮手）
  # =========================================================================
  # 这一组回答的是"**agent 链路到底有没有被正确地跑起来**"，与其余四组的分工：
  # availability 管"服务活没活"，cost 管"这轮花了多少 token"。
  # 一个只用问答的服务，这一组的全部序列都不存在（不是 0）—— 那正是它与
  # "agent 悄悄失灵"之间的区别：前者是**没有这个能力**，后者是**有这个能力但没跑起来**。
  #
  # 判据全部来自 `src/agents/*` 的埋点经 `app/main.py` 翻译（`_record_agent_metrics`
  # 与降级面的 `agent_unavailable_total`）。标签一律是**有限取值**
  # （route / reason / exit_reason / guardrail），绝不包含 thread_id 或用户输入。
  #
  # ⚠️ 这些序列**只在真的走了 agent 链路时才有**。没有 agent 流量 ⇒ 序列不存在 ⇒
  #    规则不触发（而不是"报 0"）。这是刻意的：没有能力与能力失灵要能分开。
  - name: chatagent-agent
    rules:
      - alert: AgentLinkDegraded
        # ★ 这一组里最该看的一条：**想走 agent，但走不了**。
        #   module_unavailable ⇒ 装了开关却没装 openai-agents；
        #   runtime_not_ready ⇒ 装了但模型 / Key 没配成功。
        # 两种情形下请求都会**静默退回问答链路** —— 用户收到一段看起来
        # 合理的答复，服务零报错、探针全绿。没有这条告警，只能靠用户抱怨"答得不对"。
        expr: increase(agent_unavailable_total[15m]) > 0
        for: 5m
        labels:
          category: agent
          severity: critical
        annotations:
          summary: "agent 链路不可用，请求正降级为问答链路（reason={{ $labels.reason }}）"
          description: "过去 15 分钟有 {{ $value }} 次路由判定为走不了 agent 链路。reason=module_unavailable ⇒ 未安装 openai-agents；reason=runtime_not_ready ⇒ 已安装但模型未装配成功。"
          runbook: "1) 看启动自检里的 agents 段（enabled / ready / reason 三个字段分开回显）；2) module_unavailable ⇒ pip install openai-agents 后重启；3) runtime_not_ready ⇒ 核对 AGNES_API_KEY / AGNES_MODEL / AGNES_API_BASE；4) 观察 agent_unavailable_total 停止增长即为恢复。"

      - alert: AgentHistoryDegraded
        # ★ 与 AgentLinkDegraded 同一类：**能力悄悄少了一半**。
        #   这条盯的是**跨轮历史存不上**：链路照常跑、答案照常出、延迟与错误率全正常，
        #   只是模型看不到上文 —— 用户说"接着改上一轮的东西"时它会反问"改什么的"。
        #   正因为没有任何异常信号，它是这一组里最容易被漏掉的一条。
        # 触发源有两处（同一个 PG 后端故障的不同表现）：
        #   ① 启动自检 `跨轮对话历史**不可用**`（ERROR，只打一次）；
        #   ② 每轮取会话失败（`session_for` 建引擎 / 建会话，日志去首条、其余只计数）。
        #   ⚠️ 刻意**不**含"表不存在"那类运行期故障 —— 它发生在 Runner 内部、被宽 except
        #   接住，走的是 `exit_reason=error`（由 AgentRunFailureRateHigh 发现），但降级
        #   行为一样：本轮没有历史。
        expr: increase(agent_session_errors_total[15m]) > 0
        for: 5m
        labels:
          category: agent
          severity: warning
        annotations:
          summary: "跨轮对话历史不可用，模型看不到上文（kind={{ $labels.kind }}）"
          description: "过去 15 分钟有 {{ $value }} 次会话后端故障。此时**每轮只剩用户新说的这一句**，服务照常运行、指标与延迟都正常。kind 是异常类型名（ModuleNotFoundError / OperationalError / TimeoutError…），用它区分「没装 sqlalchemy」「DB_URL 写法不对」与「PG 连不上 / 探不通」。"
          runbook: "1) 启动日志搜「跨轮对话历史」——就绪那行有实际后端名（postgres / none）与输入预算，不可用那行带原因；2) 后端=none ⇒ 没配 DB_URL，跨轮历史整体关闭，配上即恢复；3) kind=ModuleNotFoundError ⇒ 装 sqlalchemy（requirements.txt 已声明，pip install -r 没跑过会漏）；kind=NoSuchModuleError / ArgumentError ⇒ DB_URL 写法不对，异步前缀必须 postgresql+psycopg://（本仓库只装 psycopg 3 一套驱动；to_async_dsn 会自动补，手写 +asyncpg 会报驱动没装）；kind=OperationalError / TimeoutError ⇒ 核 DB_URL 主机端口、PG 容器状态与网络；4) 启动日志若报 relation \"agent_sessions\" does not exist ⇒ 迁移没跑，用 python -m app.migrations status 确认版本到 7；注意这一条**不会**计入本指标，而是走 exit_reason=error（由 AgentRunFailureRateHigh 发现）；5) 观察 agent_session_errors_total 停止增长即为恢复。"

      - alert: AgentHistoryBudgetExhausted
        # ★ 与 AgentHistoryDegraded 是**同一个症状的两个来源**：那条是"历史取不到"，
        #   这条是"历史取到了、但塞不进预算"。
        #   计数点是"已经裁到只剩用户刚说的这一句，仍然超预算" —— 也就是模型这一轮
        #   确实答不出"上面说的那个"（因为它根本没看到上面）。
        #   服务不会因此报错：请求照常 200，只是答案答非所问。
        # ⚠️ 它指向的是**配置**，不是故障：典型原因是 AGENT_HISTORY_TOKEN_LIMIT
        #   配得比模型真实窗口还大（那样裁剪永远不触发，请求被模型侧拒），或者单条
        #   输入本身就很长。启动日志里有实际生效的预算值。
        expr: increase(agent_history_over_budget_total[15m]) > 0
        for: 5m
        labels:
          category: agent
          severity: warning
        annotations:
          summary: "跨轮历史裁不下去：只剩本轮输入仍超预算（15 分钟 {{ $value }} 次）"
          description: "裁剪已经保到「最后一条必须留」的底线，输入总量仍超过 AGENT_HISTORY_TOKEN_LIMIT。此时该轮的模型输入超预算被原样发出，由模型侧判定 —— 常见结果是这一轮答不出来，或答案与上文无关。"
          runbook: "1) 启动日志搜「跨轮对话历史就绪」，确认**实际生效**的输入预算是多少；2) 与模型真实窗口核对：这是**输入**预算，工具清单与输出长度不在它的视野里，必须留余量（配成窗口大小等于每轮必超）；3) 看 agent_history_input_tokens 的分布确认「裁剪后到底多大」；4) 单条输入过长时搜日志「跨轮历史预算不足」，那条 warning 会打出当轮的实际 token 数与预算。"

      - alert: AgentHistoryBudgetErrors
        # 预算**算不出来** ⇒ 本轮**整段不裁剪**（代码刻意不因为算 budget 失败就把请求打挂）。
        # 后果是输入可能超过模型窗口而被模型侧拒 —— 表现为"这次答不出来"，
        # 而错误类型（kind）能区分是分词器问题还是形状问题。
        # 与 AgentHistoryBudgetExhausted 的区别：那条是"算出来了、裁不够"，
        # 这条是"压根没算"。
        expr: increase(agent_history_budget_errors_total[15m]) > 0
        for: 5m
        labels:
          category: agent
          severity: warning
        annotations:
          summary: "跨轮历史的 token 预算算不出来，本轮未裁剪（kind={{ $labels.kind }}）"
          description: "过去 15 分钟有 {{ $value }} 次预算计算失败，失败时**原样把历史交给模型**。日志只打首条（详情搜「跨轮历史的 token 预算算不出来」），其余只计数。"
          runbook: "1) 日志搜「跨轮历史的 token 预算算不出来」，那里有完整异常；2) kind=ModuleNotFoundError ⇒ 没装 tiktoken（requirements.txt 已声明）；OfflineTiktokenError / 网络类 ⇒ 拉不到词表，此时会自动退化成**字符数近似**并打一条 warning，功能不中断；3) kind=TypeError / AttributeError ⇒ SDK 升级后 shape 变了，看 src/agents/history_budget.py 的 _trim_sync；4) 观察该序列停止增长即为恢复。"

      - alert: AgentRunFailureRateHigh
        # 与 availability 组的 HighErrorRate 分工：那条看的是 HTTP 5xx，
        # 而 agent 内部失败会**被兜成一封得体的话术**（synthize 里降级为
        # ERROR_REPORT 交人工），HTTP 状态仍是 200 —— 不单独看这条就完全看不见。
        # 分母 clamp_min 保护：没有 agent 流量时不出结果（而不是除零报警）。
        expr: |
          rate(agent_runs_total{exit_reason=~"error|evaluator_error|max_turns"}[10m])
          / clamp_min(rate(agent_runs_total[10m]), 0.001) > 0.2
        for: 10m
        labels:
          category: agent
          severity: warning
        annotations:
          summary: "agent 链路异常收尾比例过高（> 20%）"
          description: "当前比例 {{ $value | humanizePercentage }}。exit_reason 为 error（上游抖动 / 真实故障）/ evaluator_error（评审解析失败）/ max_turns（步数耗尽）—— 三者都代表流程没跑完。⚠️ 2026-10-03 起 error **不再**被兜成一句得体话术：节点会抛 AgentRunFailed，接口返回 incomplete（客户端看得到失败），所以它可能同时抬高 5xx / 失败占比。"
          runbook: "按 exit_reason 分头查：error 多为上游超时/协议错误，看 AGNES_API_BASE 连通性；evaluator_error 看评审的结构化输出是否稳定（可提 AGENT_EVALUATOR_TRIES）；max_turns 看单任务模型调用分布（agent_model_calls），必要时提 AGENT_MAX_TURNS。⚠️ 链路已拆成前台 / 文学两个节点，**一次请求 = N 次运行**，所以先看 agent_* 的 agent 标签定位是哪一段在失败，再动手。"

      - alert: AgentReworkRateHigh
        # 返工率 = 未一次通过的**请求** / 总请求。这是"agent 能力"最直接的代理指标：
        # 高返工说明规划或执行不稳（prompt / 拓扑问题），而不是"模型慢"。
        #
        # ⚠️ 分母**必须**是 agent_route_total{route="agent"}（请求口径），不能是
        # agent_runs_total：拆分后后者是**运行**数（一次请求 1~2 次），拿它当分母
        # 会让返工率凭空缩小一半 —— 而"腰斩的返工率"看起来像是能力提升了。
        expr: |
          rate(agent_rework_total[30m])
          / clamp_min(rate(agent_route_total{route="agent"}[30m]), 0.001) > 0.5
        for: 15m
        labels:
          category: agent
          severity: warning
        annotations:
          summary: "agent 返工率过高（超过一半的任务需要多轮）"
          description: "当前 {{ $value | humanizePercentage }} 的任务在第 2 轮及以后才交付。它直接对应成本（每次返工 = 再跑一整轮模型调用）。"
          runbook: "1) 看 agent_review_outcome_total{score=...} 是 needs_improvement 居多还是 pass 居多；2) 若集中在文学节点，检查文学 agent 的 instructions 是否给了足够的篇幅/基调约束；3) 若集中在 PPT 那串工具调用，检查结构化输出（SlideDeck）的字段约束是否过严导致反复重试。"

      - alert: AgentModelCallsPerRunHigh
        # 平均每次任务的模型调用次数（histogram 的 _sum/_count）。
        # 用它而不是总调用量：总调用量涨可能是"用户变多了"（正常），
        # 而**每次**调用数涨一定是"agent 在绕圈子"（异常）。
        expr: |
          rate(agent_model_calls_sum[30m])
          / clamp_min(rate(agent_model_calls_count[30m]), 0.001) > 12
        for: 15m
        labels:
          category: agent
          severity: warning
        annotations:
          summary: "单次任务的平均模型调用次数偏高（{{ $value | humanize }} 次）"
          description: "AGENT_MAX_TURNS 默认 12。平均值已超过它就说明相当一部分任务在**贴着上限跑**，成本和延迟都会显著抬升，且更易触发 max_turns 收尾。"
          runbook: "1) 对照 agent_runs_total{exit_reason=max_turns} 确认是否已出现步数耗尽；2) ⚠️ 拆分之后一次请求 = N 次运行，`agent_model_calls` 是**各行运行之和** —— 先看 agent_runs_total 的 agent 标签确认是**哪一段**在涨（前台还是文学），只看总数会把「文学那段绕圈」误读成「整体变慢」；3) 检查专家 instructions 里的 Routine 是否被写得过长（每多一条规则就多一次工具调用）；4) 对照 agent_tool_calls 的平均值 —— 它与 agent_model_calls 同向上涨说明是「工具用得越来越多」（拓扑/提示词问题），只有模型调用涨而工具调用不涨则更可能是「模型在原地自说自话」；5) 落到**具体哪个工具**看 `agent_tool_result_total{tool,status,reason}`：`reason=\"bad_args\"` 是模型照着工具定义也填不出合法参数 ⇒ 改描述或参数结构；`reason=\"error\"` 是参数对、工具跑起来之后坏 ⇒ 查实现或依赖（两者处置相反，别一起当成「工具不稳」）；6) 再看 `agent_tool_exposed_total{tool}`（每次 agent 开始运行时，给它挂的每个工具各记一次，结果计数只在被调用时才有序列）—— **曝光在涨而结果没有**就是「挂了但从没被选中」，通常是指令里没提它、或它的描述与另一个工具重叠。"

      - alert: AgentGuardrailTripsFrequent
        # 出口护栏（引用可追溯 / 长度）与入口护栏（注入扫描）的拦截次数。
        # 引用护栏拦截 = 产出里出现了本轮没检索到的编号 ⇒ 正在编造。
        expr: increase(agent_guardrail_trips_total[30m]) > 5
        for: 5m
        labels:
          category: agent
          severity: warning
        annotations:
          summary: "agent 护栏频繁拦截（{{ $labels.guardrail }}）"
          description: "30 分钟内被拦下 {{ $value }} 次。guardrail=citation_traceability_guardrail ⇒ 模型在编造引用编号（最典型的幻觉形态）。"
          runbook: "1) 若为引用护栏：检查 research 工具是否稳定返回带编号的结论（看 agent_output_check_total 的 status 分布）；2) 若为长度护栏：核对 AGENT_MAX_ANSWER_CHARS 是否与业务期望的篇幅匹配；3) 注意护栏拦截是**正确行为**，要修的是产出质量，不是把护栏关掉。"

      - alert: AgentRetrievalEmptyHigh
        # agent 链路里的检索空召回率。与 RAG 链路的同名问题分开看：
        # 两者共用检索器，但**触发条件不同**（agent 的查询由模型改写，
        # 措辞往往更偏、更容易打空）。空召回率高时答案会变成"依据不足"，
        # 用户看到的是"答不上来"，而检索器本身没有任何错误日志。
        expr: |
          rate(rag_hits_total{via="agent", result="empty"}[15m])
          / clamp_min(rate(rag_hits_total{via="agent"}[15m]), 0.001) > 0.5
        for: 15m
        labels:
          category: agent
          severity: warning
        annotations:
          summary: "agent 链路检索空召回率过高（> 50%）"
          description: "当前 {{ $value | humanizePercentage }} 的 agent 检索打空。常见成因：语料目录未挂进容器（DOCS_DIR 指向空目录），或模型改写出的检索式与语料用词偏离较大。"
          runbook: "1) 先排除语料问题：看启动日志有无 RAG 语料为空的告警；2) 看 agent_retrieved_chunks 的分布确认是不是**全部**打空；3) 若只是部分打空，检查 researcher 的 instructions 里检索式改写的要求是否过于自由（可要求优先复用用户原词）。"

