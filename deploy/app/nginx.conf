# 灰度入口：按权重把流量分给 stable / canary，并在**连接层**先挡一道刷量。
#
# 权重改了怎么生效（不重启容器）：
#   docker compose -f deploy/app/docker-compose.yml exec nginx nginx -s reload
#
# 全量切正（观察期结束）：
#   把 canary 的 weight 改成 0 → reload → 确认无误后停掉 app-canary。
# 回滚：
#   把 canary 的 weight 改回 0（或直接 weight=stable 全占）→ reload。
#
# ⚠️ 本文件是 **HTTP(80)** 版本，适合内网/本机联调。
#    对公网提供服务请改用 `nginx.tls.conf`（HTTPS + HSTS + 80 跳转），
#    否则 API Key 会明文过网。
#
# 注意：本文件被挂到 /etc/nginx/conf.d/default.conf，即位于 http 块内部，
#      所以下面的 limit_req_zone 定义是合法的（它只能出现在 http 层）。

# 按客户端 IP 的连接层限流。
# 为什么应用层已有 120/分钟的限流，这里还要再来一道：
#   - 应用层的计数是在请求**进入业务逻辑之后**才做的，洪峰仍要消耗掉
#     FastAPI 的连接与解析开销；nginx 挡在前面更便宜。
#   - 应用层的计数是"每分钟"粒度，挡不住瞬时尖峰；这里用 rate + burst 平滑。
# 10m 共享内存约可容纳 16 万个 IP 的状态。
# rate 取值理由：正常问答接口每会话几秒一次，10r/s 对人是透明的，
# 只对脚本刷量生效。多租户高并发场景按实际压测结果上调。
limit_req_zone $binary_remote_addr zone=chatagent_ip:10m rate=10r/s;
limit_req_status 429;                 # 超限回 429（与应用层语义一致），而不是默认的 503

# ---- 认证类端点：单独一道**按真实客户端 IP** 的硬帽子 ----
# 为什么不能只靠上面那个 zone："10r/s + burst 40" 允许单个客户端每分钟打 600 次，
# 而应用侧的按 IP 额度是 120/分钟 —— 也就是说**一个客户端自己就能把应用侧那个桶刷满**。
# 平时这不要紧（桶按 IP 分，占的是他自己那份）；但如果应用部署在反向代理后面却忘了
# 打开 TRUST_PROXY_HEADERS，全站就只剩**一个**桶 —— 他一个人就能把所有同事挡在登录外面。
# 这一道把认证端点的每 IP 速率压到应用额度之下（20r/m + burst 10 ⇒ 最多 30/分钟），
# 单人最多占掉应用侧那个桶的四分之一，堵不住别人。
#
# ⚠️ 只在 /v1/auth/ 生效：靠下面的 `map` 让**非认证路径的 key 为空**。
#    nginx 官方文档对 limit_req_zone 明说 "Requests with an empty key value are
#    not accounted"（空键不计入），所以同一个 location 里两条 limit_req 互不干扰。
#    参考：https://nginx.org/en/docs/http/ngx_http_limit_req_module.html
map $uri $chatagent_auth_key {
    default     "";
    ~^/v1/auth/ $binary_remote_addr;
}
limit_req_zone $chatagent_auth_key zone=chatagent_auth:10m rate=20r/m;

# 隐藏 nginx 版本号：响应头里的版本信息是攻击者选利用链的免费线索
server_tokens off;

# ---------------------------------------------------------------------------
# 客户端 IP 从哪来（2026-10-04）
# ---------------------------------------------------------------------------
# 应用侧的按 IP 限流（含 `POST /v1/auth/login` 的防爆破闸门）读的是转发头里的
# 客户端地址。本文件在 `location` 里用 `proxy_set_header X-Forwarded-For $remote_addr`
# **覆盖**写入，所以应用拿到的那一段就是 nginx 认定的客户端地址 —— 客户端自己
# 塞进来的段会被**丢弃**，伪造不生效。
#
# 但 `$remote_addr` 到底是什么，取决于本 nginx 前面还有没有别的东西：
#   · 客户端**直连** nginx（默认形态）⇒ `$remote_addr` 就是客户端真实 IP，不用配。
#   · 前面还有**一层可信代理**（云 LB 卸 TLS、上游网关）⇒ `$remote_addr` 是那台
#     代理的地址，所有用户会挤进**同一个限流桶**（互相误伤）。这时才需要启用下面
#     的 real_ip 模块，让 nginx 从转发头里解析出真实客户端地址。
#
# ⚠️ `set_real_ip_from` 声明的是"**谁的**转发头可以相信"，所以只能填上游代理
#    自己的地址/网段。填宽了（尤其 0.0.0.0/0）等于把伪造权交出去。
# ⚠️ nginx 官方镜像已内置 `ngx_http_realip_module`（可用 `nginx -V` 自证）。
#
# set_real_ip_from  10.0.0.0/8;        # ← 换成你上游 LB 的实际私网网段
# real_ip_header    X-Forwarded-For;
# real_ip_recursive on;

upstream chatagent_backend {
    # 让后端地址**在请求时**解析，而不是在加载配置时解析一次（2026-10-06 改）。
    #
    # 为什么必须这样：`server app-stable:8000` 这种写法下，nginx 只会在**加载配置那一刻**
    # 把域名解析成 IP 并缓存。官方对 `resolve` 参数的说明把这点讲得很直白 —— 加了它才会
    # "monitor changes of the IP addresses ... **without the need of restarting nginx**"。
    # 不加时，谁重建了 app 容器（换镜像 tag、手工 `up -d`）换了 IP，nginx 就会继续往
    # **旧地址**发请求：走 nginx 的那条路**全站 502 且不自愈**（容器状态、`/health/ready`、
    # Prometheus 的 `up` 全都正常，只有经 nginx 这条路是死的，极难定位）；
    # 更糟的是那个旧 IP 还可能被**别的容器**拿走，请求会被发到无关服务上。
    #
    # 三件套缺一不可（官方口径）：
    #   ① `zone` —— "The server group must reside in the shared memory"（`resolve` 的前提）；
    #   ② `resolver` —— 必须在 http 块或**本 upstream 块**里声明。本文件是 conf.d 片段，
    #      http 块在官方镜像自带的 nginx.conf 里，改不了 ⇒ 只能写在这里
    #      （`resolver` 出现在 upstream 上下文是 1.27.3 起支持的）。
    #   ③ 每个 `server` 末尾的 `resolve` 参数本身。
    #
    # ⚠️ ③ 决定了**镜像版本下限**：`resolve` 参数在开源版是 **1.27.3** 才有的
    #    （官方原文："Prior to version 1.27.3, this parameter was available only as part of
    #    our commercial subscription"）。所以本文件与 compose 里钉的 nginx 版本是**绑定的**，
    #    降版本会让 nginx 因为语法错**起不来**。守卫：`tests/test_deploy_topology.py` 的
    #    `test_nginx_upstream_is_dynamically_resolved` 会把两者一起核对。
    zone chatagent_backend 64k;

    # Docker 内置 DNS。valid=10s ⇒ 容器换 IP 后最多 10 秒被发现；
    # ipv6=off ⇒ 不去解析 AAAA（容器网络里没有 IPv6，解析它只是多一次无用的查询）。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 9:1 —— 约 10% 流量进灰度。max_fails/fail_timeout 让 nginx 自动摘掉不健康实例，
    # 所以灰度实例崩了不会导致 10% 的请求持续失败。
    server app-stable:8000 weight=9 max_fails=3 fail_timeout=15s resolve;
    server app-canary:8000 weight=1 max_fails=3 fail_timeout=15s resolve;

    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 请求体上限：本服务是问答接口，不该收超大 body
    client_max_body_size 1m;

    # ---- 安全响应头 ----
    # 这几个头不解决业务漏洞，但能消掉一整类廉价攻击（嗅探、点击劫持、Referer 泄漏）。
    # 注意：location 里若自己写了 add_header，会覆盖掉这里 —— 所以本文件里
    # 各 location 刻意都**不**再写 add_header，让这些头全局生效。
    # HSTS 只在 TLS 版本里加（80 端口上加 HSTS 是无效且危险的）。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-XSS-Protection "0" always;

    # ---- 业务接口：限流 + SSE 友好代理 ----
    location / {
        limit_req zone=chatagent_ip burst=40 nodelay;
        # 认证端点专属的硬帽子（其它路径的 key 为空 ⇒ 不计入，见上面的 map）
        limit_req zone=chatagent_auth burst=10 nodelay;

        proxy_pass http://chatagent_backend;
        proxy_http_version 1.1;

        # keepalive 需要清掉 Connection 头
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # ⚠️ **覆盖，不是追加**（2026-10-04 订正）。`$proxy_add_x_forwarded_for`
        # 的语义是「把客户端自带的 X-Forwarded-For 原样保留在左，再把 $remote_addr
        # 追加在右」—— 于是最左段变成**客户端随便写的值**，而应用恰恰取最左段当限流键
        # （见 app/main.py 的 `_client_ip`）⇒ 攻击者换个伪造值就换一个桶，
        # 按 IP 的限流（含登录接口的防爆破闸门）整体失效。
        # 改成 $remote_addr 后，转发出去的头**只有一段** —— 就是 nginx 认定的客户端地址。
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 把 request_id 透传下去（客户端可带，服务端也会回写）
        proxy_set_header X-Request-ID      $http_x_request_id;

        # ---- SSE 必需的设置 ----
        # 关缓冲：否则 nginx 会攒够一块才转发，流式回答变成"卡一会儿一次性吐出"
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # LLM 首字节可能十几秒、整轮更久，读超时给足
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- 探针：不限流（容器健康检查与负载均衡探活会被自己的限流误杀）----
    location = /health/live {
        proxy_pass http://chatagent_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;                   # 探针每 30s 一次，日志里全是噪音
    }

    location = /health/ready {
        proxy_pass http://chatagent_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- 指标：只允许内网抓取 ----
    # 为什么必须限制：/metrics 会暴露进程内存、请求量、错误率、租户用量趋势
    # ——对攻击者是"该选什么时机打"的情报。Prometheus 一般与业务同网段，走下面的私网段即可。
    location = /metrics {
        allow 172.16.0.0/12;              # docker 默认网段
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://chatagent_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
