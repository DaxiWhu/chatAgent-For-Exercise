# 生产 TLS 入口：HTTPS(443) + HSTS + 80 自动跳转 + 权重灰度 + 连接层限流。
#
# 与 nginx.conf 的关系
# -------------------
# nginx.conf 是 **HTTP(80)** 版本，仅适合内网/本机联调。
# 本文件是**对公网提供服务时应该用的那一份** —— 不换的话，客户端提交的
# `Authorization` 令牌会以明文经过每一跳网络，等于把凭证贴在明信片上寄出去。
#
# 怎么用（三选一）
# --------------
# ① 自签证书（内网/测试，浏览器会告警）：
#      mkdir -p deploy/app/certs
#      openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#        -keyout deploy/app/certs/server.key \
#        -out    deploy/app/certs/server.crt \
#        -subj "/CN=chatagent.local"
#
# ② Let's Encrypt（有公网域名，推荐）：
#      docker run --rm -v "$PWD/deploy/app/certs:/etc/letsencrypt" \
#        -v "$PWD/deploy/app/certs:/var/www/certbot" \
#        certbot/certbot certonly --standalone -d your.domain.com
#    然后 certbot 会把证书放在 certs/live/your.domain.com/ 下，
#    注意把下面的 ssl_certificate 指向 fullchain.pem。
#
# ③ 云厂商证书（负载均衡器卸载 TLS）：那就**不用本文件**，继续用 nginx.conf，
#    但要保证"LB → nginx"这一段在私网内，并把 TRUST_PROXY_HEADERS 配成 1。
#
# 挂载方式
# --------
# **不用手改 compose**：直接用仓库里准备好的覆盖文件，它会挂本文件、挂证书目录，
# 并把 80/443 发布出来（其余端口照旧只绑回环）：
#
#   docker compose --env-file .env \
#     -f deploy/app/docker-compose.yml -f deploy/app/docker-compose.tls.yml up -d
#
# 等价的手工写法（仅在需要定制时参考）：
#   volumes:
#     - ./nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
#     - ./certs:/etc/nginx/certs:ro
#   ports: !override          # `ports` 是拼接语义，不写 !override 会同时绑 8080
#     - "80:80"
#     - "443:443"

limit_req_zone $binary_remote_addr zone=chatagent_ip:10m rate=10r/s;
limit_req_status 429;

# ---- 认证类端点：单独一道**按真实客户端 IP** 的硬帽子 ----
# 为什么不能只靠上面那个 zone："10r/s + burst 40" 允许单个客户端每分钟打 600 次，
# 而应用侧的按 IP 额度是 120/分钟 —— 也就是说**一个客户端自己就能把应用侧那个桶刷满**。
# 平时这不要紧（桶按 IP 分，占的是他自己那份）；但如果应用部署在反向代理后面却忘了
# 打开 TRUST_PROXY_HEADERS，全站就只剩**一个**桶 —— 他一个人就能把所有同事挡在登录外面。
# 这一道把认证端点的每 IP 速率压到应用额度之下（20r/m + burst 10 ⇒ 最多 30/分钟），
# 单人最多占掉应用侧那个桶的四分之一，堵不住别人。
#
# ⚠️ 只在 /v1/auth/ 生效：靠下面的 `map` 让**非认证路径的 key 为空**。
#    nginx 官方文档对 limit_req_zone 明说 "Requests with an empty key value are
#    not accounted"（空键不计入），所以同一个 location 里两条 limit_req 互不干扰。
#    参考：https://nginx.org/en/docs/http/ngx_http_limit_req_module.html
map $uri $chatagent_auth_key {
    default     "";
    ~^/v1/auth/ $binary_remote_addr;
}
limit_req_zone $chatagent_auth_key zone=chatagent_auth:10m rate=20r/m;

server_tokens off;

# ---------------------------------------------------------------------------
# 客户端 IP 从哪来（2026-10-04）
# ---------------------------------------------------------------------------
# 应用侧的按 IP 限流（含 `POST /v1/auth/login` 的防爆破闸门）读的是转发头里的
# 客户端地址；本文件在 `location` 里用 `$remote_addr` **覆盖**写入该头，
# 所以客户端伪造的段会被丢弃。详见 nginx.conf 里同一节的完整说明。
#
# 前面的"怎么用 ③ 云厂商证书（LB 卸载 TLS）"说的就是需要下面这段的形态：
# LB 卸了 TLS，nginx 看到的对端是 LB。此时**必须**启用 real_ip 模块，
# 否则 `$remote_addr` 是 LB 的地址，全体用户共用一个限流桶。
#
# ⚠️ `set_real_ip_from` 只能填 LB 自己的私网网段（它声明的是"信谁的转发头"）。
# ⚠️ nginx 官方镜像已内置 `ngx_http_realip_module`（可用 `nginx -V` 自证）。
#
# set_real_ip_from  10.0.0.0/8;        # ← 换成你上游 LB 的实际私网网段
# real_ip_header    X-Forwarded-For;
# real_ip_recursive on;

upstream chatagent_backend {
    # ⚠️ 这一段与 `nginx.conf` 里的那个 upstream **必须逐字一致**（除了本句说明）。
    #    两份文件是**互斥**挂载的（都挂到 `/etc/nginx/conf.d/default.conf`），
    #    平时不冲突 ⇒ 改了一份忘了另一份**不会报错**，只会在"切到 TLS 之后"
    #    悄悄退回旧行为。守卫：`tests/test_deploy_topology.py` 的
    #    `test_nginx_upstream_is_dynamically_resolved` 会逐行比对两个块。
    #
    # 动态解析后端地址的三件套（理由见 `nginx.conf` 那一份的详细注释）：
    # `zone` 是 `resolve` 的前提（upstream 必须在共享内存里）；
    # `resolver` 只能写在这里（本文件是 conf.d 片段，http 块在镜像自带的 nginx.conf 里）；
    # `resolve` 参数在开源版 1.27.3 起才有 ⇒ 与 compose 里钉的镜像版本是绑定的。
    zone chatagent_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;

    server app-stable:8000 weight=9 max_fails=3 fail_timeout=15s resolve;
    server app-canary:8000 weight=1 max_fails=3 fail_timeout=15s resolve;

    keepalive 32;
}

# ---- 80：只做跳转，不提供任何业务 ----
server {
    listen 80;
    server_name _;

    # ACME 挑战要能走明文（Let's Encrypt 的 HTTP-01 校验只能走 80）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 443：业务入口 ----
server {
    listen 443 ssl;
    # HTTP/2 对 SSE 是有益的（多路复用、头部压缩）。若遇到个别客户端的
    # 流式兼容问题，把这行去掉退回 HTTP/1.1 即可。
    http2 on;

    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # 只留 TLS1.2/1.3：1.0/1.1 已被主流浏览器弃用，且存在已知弱点
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;        # TLS1.3 下应由客户端选择，性能更好
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;              # 关闭会话票据，避免前向保密被票据密钥削弱

    client_max_body_size 1m;

    # ---- 安全响应头 ----
    # HSTS：告诉浏览器"以后这个域名只走 HTTPS"。
    # ⚠️ 上线前确认全站确实都能走 HTTPS 再加 max-age，否则会把用户锁在打不开的域名上。
    #    建议先用小 max-age（如 300）观察一周，再逐步调大。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-XSS-Protection "0" always;

    location / {
        limit_req zone=chatagent_ip burst=40 nodelay;
        # 认证端点专属的硬帽子（其它路径的 key 为空 ⇒ 不计入，见上面的 map）
        limit_req zone=chatagent_auth burst=10 nodelay;

        proxy_pass http://chatagent_backend;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # ⚠️ **覆盖，不是追加**（2026-10-04 订正）—— 理由同 nginx.conf，见文件顶部
        # "客户端 IP 从哪来"一节。追加式写入会让最左段变成客户端可控的值，
        # 而应用取最左段当限流键 ⇒ 限流可被伪造绕过。
        proxy_set_header X-Forwarded-For   $remote_addr;
        # $scheme 在 TLS server 块里是 https ⇒ 后端能正确判断"原始请求是安全的"，
        # 这对生成回调 URL / 判断 Cookie 属性都有影响。
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $http_x_request_id;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health/live {
        proxy_pass http://chatagent_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://chatagent_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    location = /metrics {
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://chatagent_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
