# 生产 TLS 入口：HTTPS(443) + HSTS + 80 自动跳转 + 权重灰度 + 连接层限流。
#
# 与 nginx.conf 的关系
# -------------------
# nginx.conf 是 **HTTP(80)** 版本，仅适合内网/本机联调。
# 本文件是**对公网提供服务时应该用的那一份** —— 不换的话，客户端提交的
# `X-API-Key` 会以明文经过每一跳网络，等于把凭证贴在明信片上寄出去。
#
# 怎么用（三选一）
# --------------
# ① 自签证书（内网/测试，浏览器会告警）：
#      mkdir -p deploy/app/certs
#      openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#        -keyout deploy/app/certs/server.key \
#        -out    deploy/app/certs/server.crt \
#        -subj "/CN=chatagent.local"
#
# ② Let's Encrypt（有公网域名，推荐）：
#      docker run --rm -v "$PWD/deploy/app/certs:/etc/letsencrypt" \
#        -v "$PWD/deploy/app/certs:/var/www/certbot" \
#        certbot/certbot certonly --standalone -d your.domain.com
#    然后 certbot 会把证书放在 certs/live/your.domain.com/ 下，
#    注意把下面的 ssl_certificate 指向 fullchain.pem。
#
# ③ 云厂商证书（负载均衡器卸载 TLS）：那就**不用本文件**，继续用 nginx.conf，
#    但要保证"LB → nginx"这一段在私网内，并把 TRUST_PROXY_HEADERS 配成 1。
#
# 挂载方式（docker-compose 里把默认 conf 换成它 + 挂证书目录）：
#   volumes:
#     - ./nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
#     - ./certs:/etc/nginx/certs:ro
#   ports:
#     - "8080:80"
#     - "8443:443"

limit_req_zone $binary_remote_addr zone=chatagent_ip:10m rate=10r/s;
limit_req_status 429;

server_tokens off;

upstream chatagent_backend {
    server app-stable:8000 weight=9 max_fails=3 fail_timeout=15s;
    server app-canary:8000 weight=1 max_fails=3 fail_timeout=15s;

    keepalive 32;
}

# ---- 80：只做跳转，不提供任何业务 ----
server {
    listen 80;
    server_name _;

    # ACME 挑战要能走明文（Let's Encrypt 的 HTTP-01 校验只能走 80）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 443：业务入口 ----
server {
    listen 443 ssl;
    # HTTP/2 对 SSE 是有益的（多路复用、头部压缩）。若遇到个别客户端的
    # 流式兼容问题，把这行去掉退回 HTTP/1.1 即可。
    http2 on;

    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # 只留 TLS1.2/1.3：1.0/1.1 已被主流浏览器弃用，且存在已知弱点
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;        # TLS1.3 下应由客户端选择，性能更好
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;              # 关闭会话票据，避免前向保密被票据密钥削弱

    client_max_body_size 1m;

    # ---- 安全响应头 ----
    # HSTS：告诉浏览器"以后这个域名只走 HTTPS"。
    # ⚠️ 上线前确认全站确实都能走 HTTPS 再加 max-age，否则会把用户锁在打不开的域名上。
    #    建议先用小 max-age（如 300）观察一周，再逐步调大。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-XSS-Protection "0" always;

    location / {
        limit_req zone=chatagent_ip burst=40 nodelay;

        proxy_pass http://chatagent_backend;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # $scheme 在 TLS server 块里是 https ⇒ 后端能正确判断"原始请求是安全的"，
        # 这对生成回调 URL / 判断 Cookie 属性都有影响。
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $http_x_request_id;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health/live {
        proxy_pass http://chatagent_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://chatagent_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    location = /metrics {
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://chatagent_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
