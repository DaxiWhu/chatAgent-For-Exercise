# gitleaks 配置：密钥扫描的**允许清单**。
#
# 为什么需要这个文件（而不是直接跑默认规则）
# ----------------------------------------
# 默认规则会把**示例文件里的占位值**当成泄露。`.env.example` 是刻意公开的模板，
# 它里面的 `POSTGRES_PASSWORD=123456` / `REDIS_PASSWORD=chatagent-redis` 是
# "本机开发用的默认值"，**不是**任何真实环境的凭据。
#
# 这类误报的代价不是"多看一眼"，而是**门禁失效**：一旦 CI 常年挂着几条假阳性，
# 真泄露出现时没人会当回事 —— 与 `.trivyignore` 头部写的是同一条道理。
#
# ⚠️ 允许清单的纪律（与 .trivyignore 一致）
# ---------------------------------------
#   1. 只允许**路径**，不要按规则名整类放行（那会连真实泄露一起放过）；
#   2. 每一条都要写清"为什么这里出现的东西不可能造成危害"；
#   3. 新增允许项优先怀疑"是不是真把凭据写进去了"——先排查，再放行。

title = "chatAgent gitleaks config"

# 沿用 gitleaks 内置规则集；下面只做**定向**放宽。
[extend]
useDefault = true

[allowlist]
description = "示例文件、本地工具产物与临时探针目录 —— 不含真实环境凭据"

# 路径级允许清单。用正则（gitleaks 的 paths 是 regex，不是 glob）。
paths = [
  # 本地 .env 与其变体。它们**已被 .gitignore 忽略** —— CI 的 checkout 里根本
  # 不存在这些文件，本条只影响"本地手动跑 gitleaks"。放行的理由是：对一个永远
  # 不可能进仓库的文件做密钥扫描，唯一产出就是"本机口令被打成泄露"的假阳性，
  # 而假阳性会让门禁被习惯性忽略。
  #
  # ⚠️ 必须**显式枚举**，不能写成 `^\.env(\..*)?$`（2026-10-05 改）
  # ----------------------------------------------------------------
  # 那条正则把 **`.env.example` 也一起放行了**（`.env` + `.example`），而
  # `.env.example` 是**随仓库分发**的公开模板 —— 恰恰是最容易被顺手粘进真密钥的
  # 文件（"我要加个新配置项，先在模板里试一下"）。而它正是本文件末尾那条
  # "只允许路径、且每条都要说得清为什么"的纪律最容易被违反的形式：
  # 放行一个**随仓库走的文件**，等于把门禁在这条路径上整个关掉，
  # 而且没人会注意到，因为那行正则看起来只是在忽略"本地 .env"。
  #
  # 注意：**不**包括 deploy/app/canary.env —— 那个是**随仓库分发**的，
  # 必须继续被扫描（它现在只有注释，将来若有人把真凭据写进去，正该被拦住）。
  '''^\.env$''',
  '''^\.env\.(bak|bakw|local|tmp|old|orig|save|swp)$''',

  # 临时探针目录：本轮排查 SDK 调用形状时创建的临时安装目录，已被 .gitignore 忽略。
  '''^tmp_probe[/\\]''',

  # 工作区记忆：里面记录的是**判断与约束**，不记凭据
  # （生成口令时只记录"已生成"与前缀，不落明文）。
  '''^\.workbuddy[/\\]''',

  # 测试目录：为了断言"生产不下发数据库地址/口令"这类行为，
  # 测试里必须出现 `password`、`10.0.0.5` 这类**假值**。
  '''^tests[/\\]''',
]

# ⚠️ 路径分隔符必须写成 `[/\\]`，不能只写 `/`（2026-10-05 实测）
# ---------------------------------------------------------------
# gitleaks 在 Windows 上传进来的 `file` 是**反斜杠**路径（`tmp_probe\sops_scratch\...`），
# 只写 `^tmp_probe/` 时那条放行**在 Windows 上完全不匹配**。实测：本地扫工作树
# 得到 28 处命中，全部落在本该被放行的 `tmp_probe/` 里 —— 也就是"这条放行看着生效
# （CI 是 Linux，路径是 `/`），本地却一路报警"。
#
# 这不是理论问题：一个"只在某个平台上生效的放行规则"会训练出
# "本地那堆告警反正都是假的"的习惯，而那条习惯正好会盖掉真泄露。
# 同一个坑本仓库在 sops 的判据里踩过（那里的正则写的就是 `[/\\]`）。

# 正则级允许清单：挡住"看起来像密钥、实际是占位符"的常见形态。
regexes = [
  # 显式占位符
  '''(?i)(REPLACE[-_]?ME|CHANGE[-_]?ME|your[-_]?(api)?[-_]?key|xxxx+)''',
  # 空值赋值（KEY= 后面什么都没有）—— 这是 .env.example 里最常见的形态，
  # 表示"留空 = 未启用"，不是"泄露了一个空密钥"。
  '''(?i)(api[-_]?key|token|secret|password)\s*=\s*$''',
]

# ---------------------------------------------------------------------------
# 刻意**没有**为 SOPS 密文（`secrets/app.sops.env`）加放行 —— 这是实测结论，不是遗漏
# ---------------------------------------------------------------------------
# 直觉上应该放行：那里面每个值都是 `ENC[AES256_GCM,data:...]` 这种高熵字符串，
# 而键名就叫 `AGNES_API_KEY` / `POSTGRES_PASSWORD`，看着正是 generic-api-key 的靶子。
#
# 但实测（gitleaks 8.30.1，配置=本文件、只摘掉 `^tmp_probe/` 那条无关的路径放行）：
#
#   扫描真实密文            → 0 命中
#   加上放行规则再扫同一份  → 也是 0 命中（⇒ 那条放行是**多余的**）
#   对照：把明文 .env 复制成 secrets/app.sops.env → **4 处命中、退出码 1**
#
# 原因是 generic-api-key 的值只吃 `[a-zA-Z0-9\-_.=+/]`，撞到 `ENC[` 的 `[` 就断了，
# 截出来只有 3 个字符，过不了长度与熵的门槛。元数据行（`sops_*`）的键名里没有
# keyword，也不会命中。
#
# ⇒ 不加放行。**加一条永远不会生效的放行，代价不是"多一行"，是让下一个人以为
#    "这个文件有特殊性、需要被网开一面"** —— 而对照实验说明那个文件根本不需要，
#    真正的兜底（明文不应该出现在那个路径）反而会因为按路径放行而失效。
#    （这也正是本文件顶部第 1 条纪律说的：只允许路径、且每条都要说得清为什么。）
#
# 复现：`python tmp_probe/gitleaks_probe.py`
