[pytest]
# 只注册 marker，**不设 addopts** —— 保持"裸 `pytest tests/` 就是全量"的现有行为。
# 在这一行的意义上，marker 注册的唯一作用是：让 `-m e2e` / `-m "not e2e"` 可用，
# 并且不再对 `pytest.mark.e2e` 报 PytestUnknownMarkWarning（警告多了就会被无视）。
markers =
    e2e: 需要真实运行中的栈（默认跳过；用 `python scripts/tasks.py e2e` 一键起栈并运行）

# ⚠️ `testpaths`：让**裸 `pytest`** 与 `pytest tests/` 完全等价（上面那句约定就是它）。
# 没有它时，裸 `pytest` 会从**仓库根**开始收集，于是 `tmp_probe/`（本地排障探针的
# 临时产物，已被 .gitignore 忽略）里那些整份目录快照 —— 例如 `_pre_fix/tests/` ——
# 会被当成第二份同名模块，整个**收集阶段**直接 `ImportPathMismatch` 中断：
# 一个用例都跑不了，而且报错指向的路径与被测代码毫无关系。（2026-10-06 实际踩到。）
#
# 为什么不用 `norecursedirs = tmp_probe`：设了它就会**整体覆盖** pytest 自带的默认
# 排除项（`*.egg .* build dist node_modules venv` 等），等于把一份"本来由上游维护
# 的清单"抄进本项目，将来上游调整只会静默分叉 —— 正是本项目这几天反复在修的那类毛病。
testpaths = tests
